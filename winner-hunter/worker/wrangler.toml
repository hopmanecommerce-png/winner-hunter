# The Winner Hunter board: deployed by .github/workflows/deploy-board.yml (npx wrangler@4 deploy).
name = "winner-hunter-clean"
main = "src/index.mjs"
compatibility_date = "2025-09-01"
workers_dev = true
# @cloudflare/puppeteer (the ad viewer) imports node:buffer.
compatibility_flags = ["nodejs_compat"]
# No __name() helpers in the bundle: the ad extractor is sent to the browser as source text.
keep_names = false

# board.html is bundled as text (imported in src/index.mjs).
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "winner-hunter-clean"
database_id = "8934aca9-51d3-4f87-9c62-e897843149a1"
migrations_dir = "migrations"

# Browser Run (headless Chromium) for the ad viewer: GET /api/ad/:id opens Meta's render_ad page.
# Free plan: 10 browser minutes a day.
[browser]
binding = "BROWSER"

# Secrets (not in this file): BOARD_PIN, set by the deploy workflow from the GitHub secret.
# Optional: BOARD_SECRET (32+ random characters), the cookie's key next to the PIN, set with
# `npx wrangler secret put BOARD_SECRET`. Without it the board makes a random key at the first login and keeps it in D1
# (state 'cookie_key'). Setting or changing it logs every phone out.
# The ad viewer is off (the board no longer uses it): /api/ad/:id answers only with AD_VIEWER = "on" under [vars] here
# and a META_TOKEN secret (npx wrangler secret put META_TOKEN). The deploy does not set that token, so keep it fresh yourself.
