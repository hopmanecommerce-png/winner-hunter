<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04050a">
<meta name="color-scheme" content="dark">
<title>Winner Hunter</title>
<style nonce="__NONCE__">
  :root {
    color-scheme: dark;
    --bg: #04050a; --card: #0b0d18; --card2: rgba(255, 255, 255, .045); --glass: rgba(8, 10, 20, .62);
    --ink: #eef1ff; --muted: #8f95b8; --faint: #5f6589; --line: rgba(150, 160, 255, .12); --line2: rgba(150, 160, 255, .26);
    --cy: #2ee6ff; --vi: #8b5cff; --mg: #ff4fd8; --holo: linear-gradient(110deg, #2ee6ff 0%, #8b5cff 52%, #ff4fd8 100%);
    --win: #3dffb0; --bad: #ff5c7a; --amb: #ffc94d; --link: #7fdcff;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --r: 20px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; background: var(--bg); }
  body { margin: 0; min-height: 100vh; color: var(--ink); font: 15px/1.4 var(--sans); -webkit-font-smoothing: antialiased; background: var(--bg); overflow-x: hidden; }
  /* Aurora and a fading grid behind everything */
  body::before { content: ''; position: fixed; inset: -20vmax; z-index: -2; pointer-events: none;
    background: radial-gradient(38vmax 30vmax at 18% 8%, rgba(46, 230, 255, .16), transparent 70%),
      radial-gradient(34vmax 28vmax at 88% 4%, rgba(255, 79, 216, .14), transparent 70%),
      radial-gradient(40vmax 30vmax at 50% 105%, rgba(139, 92, 255, .14), transparent 70%);
    animation: drift 26s ease-in-out infinite alternate; }
  body::after { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image: linear-gradient(rgba(150, 160, 255, .055) 1px, transparent 1px), linear-gradient(90deg, rgba(150, 160, 255, .055) 1px, transparent 1px);
    background-size: 44px 44px; -webkit-mask-image: radial-gradient(120% 70% at 50% 0, #000 10%, transparent 75%); mask-image: radial-gradient(120% 70% at 50% 0, #000 10%, transparent 75%); }
  @keyframes drift { to { transform: translate3d(3vmax, 2vmax, 0) rotate(4deg); } }
  button, input, select { font: inherit; color: inherit; }
  button { -webkit-user-select: none; user-select: none; }
  svg { display: block; }
  :focus-visible { outline: 2px solid var(--cy); outline-offset: 2px; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 56px max(16px, env(safe-area-inset-left)); }
  .kick { font: 600 10.5px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .holo { background: var(--holo); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* Top: orb, name, run status, export, log out */
  .top { display: flex; align-items: center; gap: 12px; padding: 6px 0 12px; }
  .orb { position: relative; width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%; background: conic-gradient(from 0deg, #2ee6ff, #8b5cff, #ff4fd8, #2ee6ff); animation: spin 6s linear infinite; box-shadow: 0 0 22px rgba(46, 230, 255, .45), 0 0 40px rgba(255, 79, 216, .25); }
  .orb::before { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #fff 0 3px, #0b0d18 4px); }
  .brand { display: grid; gap: 3px; min-width: 0; }
  h1 { margin: 0; font-size: 20px; font-weight: 760; letter-spacing: -.03em; white-space: nowrap; line-height: 1; }
  .tools { margin-left: auto; display: flex; gap: 6px; }
  .ic { height: 36px; min-width: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 600 11.5px var(--mono); letter-spacing: .08em; text-decoration: none; cursor: pointer; transition: border-color .2s, box-shadow .2s; }
  .ic:hover { border-color: var(--cy); box-shadow: 0 0 18px -4px rgba(46, 230, 255, .6); }
  .status { display: inline-flex; align-items: center; gap: 9px; max-width: 100%; margin: 0 0 14px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    font: 500 11px/1.35 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .status .run { overflow-wrap: anywhere; }
  .run b { color: var(--ink); font-weight: 700; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: 0 0 7px; }
  .status.ok .dot { background: var(--win); box-shadow: 0 0 10px var(--win); }
  .status.live .dot { background: var(--cy); box-shadow: 0 0 10px var(--cy); animation: blink 1.4s ease-in-out infinite; }
  .status.warn { border-color: rgba(255, 201, 77, .35); }
  .status.warn .dot { background: var(--amb); box-shadow: 0 0 10px var(--amb); }
  .status.warn .run { color: var(--amb); }
  .status.bad .dot { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .alert { margin: 0 0 12px; padding: 12px 14px; border-radius: 14px; font-weight: 600; font-size: 14px; overflow-wrap: anywhere; color: #fff; background: linear-gradient(110deg, rgba(255, 92, 122, .9), rgba(255, 79, 216, .75)); box-shadow: 0 0 30px -8px var(--bad); }
  .alert.yellow { background: linear-gradient(110deg, rgba(255, 201, 77, .95), rgba(255, 150, 77, .85)); color: #1a1406; }

  /* Market Radar */
  .radar { position: relative; border-radius: 24px; padding: 18px; margin-bottom: 16px; overflow: hidden;
    background: linear-gradient(var(--card), var(--card)) padding-box, linear-gradient(135deg, rgba(46, 230, 255, .55), rgba(139, 92, 255, .15) 45%, rgba(255, 79, 216, .5)) border-box; border: 1px solid transparent;
    box-shadow: 0 30px 80px -40px rgba(46, 230, 255, .35); }
  .rh { position: relative; z-index: 1; display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .rh .sub { color: var(--faint); font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .rh button { margin-left: auto; }
  .rtop { position: relative; z-index: 1; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; padding: 4px 0 16px; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; }
  .ring { position: relative; width: 104px; height: 104px; isolation: isolate; }
  /* The radar sweep turns around the #1 market's flag. */
  .ring::before, .ring::after { content: ''; position: absolute; left: 50%; top: 50%; width: 300%; height: 300%; transform: translate(-50%, -50%); border-radius: 50%; z-index: -1; pointer-events: none;
    -webkit-mask-image: radial-gradient(circle, #000 25%, transparent 68%); mask-image: radial-gradient(circle, #000 25%, transparent 68%); }
  .ring::before { background: repeating-radial-gradient(circle, rgba(46, 230, 255, .16) 0 1px, transparent 1px 22px); }
  .ring::after { background: conic-gradient(from 0deg, rgba(46, 230, 255, .38), transparent 20%); animation: sweep 4.5s linear infinite; }
  @keyframes sweep { from { transform: translate(-50%, -50%) rotate(0); } to { transform: translate(-50%, -50%) rotate(360deg); } }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .trk { stroke: rgba(150, 160, 255, .12); }
  .ring .val { stroke: url(#holoStroke); filter: drop-shadow(0 0 6px rgba(46, 230, 255, .6)); transition: stroke-dasharray .8s cubic-bezier(.2, .8, .2, 1); }
  .ring .fl { position: absolute; inset: 0; display: grid; place-items: center; font-size: 38px; line-height: 1; }
  .rnum { display: grid; gap: 4px; min-width: 0; }
  .rnum .nm { font-size: 30px; font-weight: 800; letter-spacing: -.035em; line-height: 1.02; overflow-wrap: anywhere; }
  .rnum .big { font-size: 15px; color: var(--ink); font-weight: 600; }
  .rnum .big b { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .rnum .lead { color: var(--muted); font-size: 12.5px; }
  .rlist { position: relative; z-index: 1; list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .mk { width: 100%; display: grid; grid-template-columns: 22px 26px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; border: 1px solid transparent; background: none; cursor: pointer; text-align: left; transition: background .2s, border-color .2s; }
  .mk:hover { background: var(--card2); }
  .mk[aria-pressed="true"] { border-color: var(--cy); background: rgba(46, 230, 255, .07); box-shadow: 0 0 22px -10px var(--cy); }
  .mk .rk { font: 600 11px var(--mono); color: var(--faint); }
  .mk .fl { font-size: 20px; line-height: 1; }
  .mk .mid { min-width: 0; display: grid; gap: 5px; }
  .mk .nm { font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mk .nm small { color: var(--faint); font: 500 11px var(--mono); margin-left: 6px; }
  .bar { height: 5px; border-radius: 99px; background: rgba(150, 160, 255, .1); overflow: hidden; }
  .bar i { display: block; height: 100%; width: var(--w, 0%); border-radius: inherit; background: var(--holo); box-shadow: 0 0 10px rgba(46, 230, 255, .6); transition: width .9s cubic-bezier(.2, .8, .2, 1); }
  .mk .vv { text-align: right; font-variant-numeric: tabular-nums; }
  .mk .vv b { display: block; font-size: 14px; font-weight: 750; }
  .mk .vv span { font: 500 10.5px var(--mono); color: var(--muted); }
  .rfoot { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 10px; color: var(--faint); font: 500 10.5px/1.4 var(--mono); letter-spacing: .04em; }
  .ghost { border: 1px solid var(--line); background: var(--card2); color: var(--ink); border-radius: 999px; height: 32px; padding: 0 13px; font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; white-space: nowrap; transition: border-color .2s; }
  .ghost:hover { border-color: var(--cy); }
  .radar.min .rbody, .radar.min .rfoot { display: none; }
  .rviews { position: relative; z-index: 1; display: grid; gap: 10px; min-width: 0; }
  .rtabs { display: inline-flex; justify-self: start; padding: 3px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); }
  .rtabs button { border: 0; background: none; border-radius: 9px; height: 30px; padding: 0 12px; color: var(--muted); font: 600 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  .rtabs button[aria-pressed="true"] { color: var(--ink); background: rgba(46, 230, 255, .1); box-shadow: inset 0 0 0 1px rgba(46, 230, 255, .45); }
  .radar[data-rv="list"] .hexmap, .radar[data-rv="map"] .rlist { display: none; }
  /* Europe as glowing hexagons: the more reach a day, the brighter. */
  .hexmap { display: grid; place-items: center; min-width: 0; }
  .hexmap svg { width: 100%; max-width: 360px; height: auto; overflow: visible; }
  .hexmap .hx { cursor: pointer; transition: opacity .2s; }
  .hexmap .hx.off { cursor: default; }
  .hexmap .hx polygon { stroke: rgba(150, 160, 255, .2); stroke-width: 1; transition: stroke .2s; }
  .hexmap .hx:not(.off):hover polygon { stroke: var(--cy); }
  .hexmap .hx.on polygon { stroke: #fff; stroke-width: 1.8; }
  .hexmap .hx.hot polygon { animation: hot 2.4s ease-in-out infinite; }
  @keyframes hot { 50% { stroke: rgba(255, 255, 255, .9); } }
  .hexmap text { font: 600 8.5px var(--mono); letter-spacing: .04em; fill: rgba(238, 241, 255, .9); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .hexmap .hx.off text { fill: rgba(150, 160, 255, .35); }
  .hexmap .lg { display: flex; justify-content: space-between; width: 100%; max-width: 360px; margin-top: 6px; font: 500 10px var(--mono); color: var(--faint); letter-spacing: .06em; text-transform: uppercase; }
  .hexmap .lg i { flex: 1; height: 4px; margin: 5px 10px 0; border-radius: 9px; background: linear-gradient(90deg, rgba(46, 230, 255, .15), #2ee6ff, #8b5cff, #ff4fd8); }
  .radar.min .rh { margin: 0; }

  /* The sticky rail: view, search, filters */
  .rail { position: sticky; top: 0; z-index: 5; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left))); padding: 10px max(16px, env(safe-area-inset-left)); display: grid; gap: 10px;
    background: rgba(4, 5, 10, .72); -webkit-backdrop-filter: saturate(160%) blur(20px); backdrop-filter: saturate(160%) blur(20px); border-bottom: 1px solid var(--line); }
  .bar2 { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .seg { display: inline-flex; padding: 3px; border-radius: 14px; background: var(--card2); border: 1px solid var(--line); flex: 0 0 auto; }
  .seg button { border: 0; background: none; border-radius: 11px; padding: 0 12px; height: 34px; font-size: 14px; font-weight: 650; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background .2s, color .2s, box-shadow .2s; }
  .seg button[aria-pressed="true"] { background: rgba(46, 230, 255, .1); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(46, 230, 255, .5), 0 0 16px -6px var(--cy); }
  .seg small { font: 600 11px var(--mono); color: var(--faint); }
  .seg button[aria-pressed="true"] small { color: var(--cy); }
  .count { color: var(--muted); font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; margin-top: -2px; }
  .find { display: contents; }
  .search { position: relative; display: block; min-width: 0; flex: 1 1 auto; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  input[type="search"] { width: 100%; height: 42px; border-radius: 14px; border: 1px solid var(--line); background: var(--card2); padding: 0 12px 0 36px; font-size: 15px; outline: none; transition: border-color .2s, box-shadow .2s; -webkit-appearance: none; appearance: none; }
  input[type="search"]::placeholder { color: var(--faint); }
  input[type="search"]:focus { border-color: var(--cy); box-shadow: 0 0 0 3px rgba(46, 230, 255, .12), 0 0 24px -8px var(--cy); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left))); padding: 0 max(16px, env(safe-area-inset-left)); }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card2); font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; transition: background .2s, color .2s, border-color .2s, box-shadow .2s; }
  .chip:hover { border-color: var(--line2); }
  .chip[aria-pressed="true"] { background: var(--holo); border-color: transparent; color: #06070d; box-shadow: 0 0 18px -6px var(--vi); }
  .chip.ccx { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); border-color: var(--cy); background: rgba(46, 230, 255, .1); box-shadow: 0 0 16px -6px var(--cy); }
  .chip.ccx b { font-size: 16px; line-height: 1; }
  .selw { position: relative; flex: 0 0 auto; display: inline-flex; }
  .selw::after { content: ''; position: absolute; right: 13px; top: 12px; width: 5px; height: 5px; border: solid var(--faint); border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); pointer-events: none; }
  select.chip { -webkit-appearance: none; appearance: none; padding-right: 30px; color: var(--ink); background: var(--card2); }
  select.chip option { background: #0b0d18; }

  /* Cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); grid-auto-flow: row dense; gap: 14px; margin-top: 14px; }
  .card { position: relative; border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; min-width: 0; cursor: pointer;
    background: linear-gradient(var(--card), var(--card)) padding-box, linear-gradient(150deg, rgba(46, 230, 255, .32), rgba(139, 92, 255, .1) 38%, rgba(150, 160, 255, .06) 62%, rgba(255, 79, 216, .28)) border-box; border: 1px solid transparent;
    box-shadow: 0 20px 50px -30px rgba(0, 0, 0, .9); animation: rise .45s cubic-bezier(.2, .8, .2, 1) backwards; transition: opacity .25s, transform .25s, box-shadow .3s;
    transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); }
  /* Desktop: the card leans toward the pointer, with a glare where the light hits. */
  .card::after { content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .3s; border-radius: inherit;
    background: radial-gradient(420px circle at var(--gx, 50%) var(--gy, 0%), rgba(255, 255, 255, .11), transparent 45%); }
  .card.tilt::after { opacity: 1; }
  .card.tilt { transition: opacity .25s, box-shadow .3s; }
  @media (hover: hover) {
    .card:hover { box-shadow: 0 0 0 1px rgba(46, 230, 255, .35), 0 24px 60px -24px rgba(46, 230, 255, .35); }
    .card:hover .ph img { transform: scale(1.04); }
    .acts .ok:hover { border-color: rgba(61, 255, 176, .5); box-shadow: 0 0 16px -6px var(--win); }
    .acts .no:hover { border-color: rgba(255, 92, 122, .5); box-shadow: 0 0 16px -6px var(--bad); }
  }
  .card.gone { opacity: 0; transform: scale(.94) translateY(6px); pointer-events: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.985); } }
  .ph { position: relative; aspect-ratio: 1 / 1; background: #0f1222; display: grid; place-items: center; overflow: hidden; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
  .ph::after { content: ''; position: absolute; inset: 52% 0 0; background: linear-gradient(to top, rgba(4, 5, 12, .86), rgba(4, 5, 12, .35) 50%, rgba(4, 5, 12, 0)); pointer-events: none; }
  .ph .dom { font: 600 12px var(--mono); color: var(--muted); padding: 12px; text-align: center; overflow-wrap: anywhere; letter-spacing: .04em; }
  .badges { position: absolute; left: 8px; top: 8px; right: 52px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 1; }
  .tag { font: 700 9.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #fff; background: rgba(4, 5, 12, .55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, .12); border-radius: 999px; padding: 5px 7px; white-space: nowrap; }
  .tag.new { background: var(--holo); color: #06070d; border: 0; box-shadow: 0 0 12px rgba(46, 230, 255, .5); }
  .tag.out { background: rgba(255, 201, 77, .9); color: #1a1406; border: 0; }
  .tag.sp { padding: 4px 6px; opacity: .85; }
  .tag.sp svg { display: block; }
  .star { position: absolute; right: 8px; top: 8px; z-index: 1; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .14); display: grid; place-items: center; cursor: pointer;
    color: #fff; background: rgba(4, 5, 12, .45); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: transform .2s, background .2s, box-shadow .2s; }
  .star svg { fill: none; stroke: currentColor; stroke-width: 1.8; }
  .star[aria-pressed="true"] { color: var(--amb); border-color: rgba(255, 201, 77, .6); background: rgba(40, 30, 6, .7); box-shadow: 0 0 18px rgba(255, 201, 77, .55); }
  .star[aria-pressed="true"] svg { fill: currentColor; }
  .star:active, .view:active { transform: scale(.88); }
  .hero { position: absolute; left: 11px; bottom: 10px; z-index: 1; color: #fff; display: grid; line-height: 1; pointer-events: none; }
  .hero b { font-size: 24px; font-weight: 800; letter-spacing: -.035em; font-variant-numeric: tabular-nums; text-shadow: 0 0 18px rgba(46, 230, 255, .55); }
  .hero span { font: 600 9.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--cy); margin-top: 4px; }
  .view { position: absolute; right: 9px; bottom: 9px; z-index: 1; width: 42px; height: 42px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; color: #06070d; background: var(--holo);
    box-shadow: 0 0 0 4px rgba(46, 230, 255, .12), 0 0 24px rgba(139, 92, 255, .65); text-decoration: none; transition: transform .2s; }
  .view svg { margin-left: 2px; }
  .bd { padding: 12px 12px 4px; display: grid; gap: 8px; min-width: 0; align-content: start; }
  .t { margin: 0; font-size: 14.5px; font-weight: 650; line-height: 1.28; letter-spacing: -.012em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .price { font-size: 14px; font-weight: 700; display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; font-variant-numeric: tabular-nums; }
  .price s { color: var(--faint); font-size: 12px; font-weight: 500; }
  .off { color: var(--win); font: 700 11px var(--mono); text-shadow: 0 0 10px rgba(61, 255, 176, .45); }
  .flags { display: flex; gap: 4px; flex-wrap: wrap; min-width: 0; }
  .flags span { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px 3px 5px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); font: 600 10.5px var(--mono); color: var(--muted); }
  .flags span i { font-style: normal; font-size: 13px; line-height: 1; }
  .flags span.hit { color: var(--ink); border-color: var(--cy); background: rgba(46, 230, 255, .1); }
  .meta { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .8fr) minmax(0, 1fr); background: var(--card2); border: 1px solid var(--line); border-radius: 13px; padding: 7px 0; }
  .m { min-width: 0; padding: 0 9px; }

// ---- Market Radar: which country the winning products get their reach in.
const RING = 2 * Math.PI * 44;

}
let shownTop = '';
function radar() {

  if ($('radar').hidden) return;
  const min = store.get('wh-radar') === 'min';

  $('rtop').innerHTML = `<div class="ring"><svg viewBox="0 0 104 104"><circle class="trk" cx="52" cy="52" r="44" fill="none" stroke-width="7"/><circle class="val" id="ringVal" cx="52" cy="52" r="44" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 ${RING}"/></svg><span class="fl">${flag(top.cc)}</span></div>

// ---- Inbox: every product you have not decided on, one at a time. Reject, Keep (★) or Made ad until none are left.
const today = () => new Date().toLocaleDateString('sv'); // YYYY-MM-DD, this phone's day
function cleared(add) {
  let c = {};
  try { c = JSON.parse(store.get('wh-done') || '{}') || {}; } catch (e) { c = {}; }
  const n = c.d === today() ? Number(c.n) || 0 : 0;
  if (!add) return n;
  store.set('wh-done', JSON.stringify({ d: today(), n: Math.max(0, n + add) }));
  return Math.max(0, n + add);
}
// The nightly hunt starts 01:17 UTC (winner-hunter.yml); GitHub can start it a little later.
function nextHunt() {
  const n = new Date();
  const t = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate(), 1, 17));
  if (t <= n) t.setUTCDate(t.getUTCDate() + 1);
  const day = t.toLocaleDateString('sv') === today() ? 'today' : 'tomorrow';
  return `Next hunt: ${day} ~${t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
}
let HUNTING = false;
// Your note on the Inbox product: the ad, the competitor, the product. Saved as you type (and when you decide).
// Below it: your notes on other products of the same store or advertiser.
const NOTE = { id: '', saved: '', timer: 0 };
async function loadNote(a) {
  clearTimeout(NOTE.timer);
  Object.assign(NOTE, { id: a.id, saved: '' });
  $('pn').value = '';
  $('pns').textContent = '';
  $('pold').innerHTML = '';
  try {
    const res = await fetch('/api/note?ad_id=' + encodeURIComponent(a.id), { credentials: 'same-origin', headers: { Accept: 'application/json' } });
    const j = await res.json();
    if (!res.ok || NOTE.id !== a.id) return;
    NOTE.saved = j.note || '';
    if (!$('pn').value) $('pn').value = NOTE.saved; // unless you started typing already
    $('pold').innerHTML = j.others.length ? `<b>Your notes on ${esc(host(a.store) || a.adv)}</b>${j.others.map((n) => `<div>${esc(n.note)}<small>${esc(n.title)}${n.title ? ' · ' : ''}${esc(ago(n.at))}</small></div>`).join('')}` : '';
  } catch (e) {
    // the box still works without the old notes
  }
}
async function saveNote() {
  clearTimeout(NOTE.timer);
  const id = NOTE.id;
  const t = $('pn').value.trim();
  if (!id || t === NOTE.saved) return;
  NOTE.saved = t;
  $('pns').textContent = 'Saving…';
  try {
    const res = await fetch('/api/note', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ad_id: id, note: t }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    if (NOTE.id === id) $('pns').textContent = t ? 'Saved ✓' : '';
  } catch (e) {
    if (NOTE.saved === t) NOTE.saved = null; // try again on the next change
    if (NOTE.id === id) $('pns').textContent = '';
    toast('Could not save the note: ' + e.message, '');
  }
}
$('pn').addEventListener('input', () => { clearTimeout(NOTE.timer); $('pns').textContent = ''; NOTE.timer = setTimeout(saveNote, 800); });
$('pn').addEventListener('focus', () => document.body.classList.add('noting'));
$('pn').addEventListener('blur', () => { document.body.classList.remove('noting'); saveNote(); });
$('pn').addEventListener('keydown', (e) => { if (e.key === 'Escape' || (e.key === 'Enter' && !e.shiftKey)) { e.preventDefault(); $('pn').blur(); } });
function renderInbox() {
  const a = ADS[0];
  const done = cleared();
  $('pnote').hidden = !a;
  $('nin').textContent = total || '';
  if (!a && total > 0) { $('grid').innerHTML = SKELETON; $('zero').hidden = true; return; } // the next page is on its way
  $('ibox').hidden = $('tri').hidden = !a;
  $('dock').hidden = !a && !LAST;
  renderWhy();
  $('zero').hidden = !!a;
  if (!a) {
    $('grid').innerHTML = '';
    $('zero').innerHTML = `<div class="big">🎉</div><h2>Inbox zero</h2>
      <p>${done ? `${esc(done)} cleared today` : 'Nothing left to decide'}</p>
      <p>${HUNTING ? 'Hunting now: new products are coming in' : esc(nextHunt())}</p>
      <div class="zb">${STARS ? `<button class="kept" data-go="starred">★ ${esc(STARS)} kept → make ads</button>` : ''}<button data-go="all">Browse all</button></div>`;
    return;
  }
  $('grid').innerHTML = card(a, true);
  if (NOTE.id !== a.id) { saveNote(); loadNote(a); }
  $('ileft').textContent = `${total.toLocaleString('en-US')} left`;
  $('inew').textContent = FRESH ? `${FRESH} new today` : '';
  $('iprog').style.setProperty('--w', (done + total ? (done / (done + total)) * 100 : 0) + '%');
}
const isNew = (a) => Date.now() - Date.parse(a.first_seen) < NEW_MS;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let deciding = false;
async function decide(kind, dir) {
  const a = ADS[0];
  if (st.view !== 'inbox' || !a || deciding || !$('sheet').hidden) return;
  deciding = true;
  saveNote(); // what you typed goes with this product
  const c = $('grid').querySelector('.card');
  if (c && !calm) {
    const dx = dir != null ? dir : kind === 'seen' ? 1 : kind === 'rejected' ? -1 : 0;
    c.classList.remove('drag');
    c.style.transform = `translate(${dx * 120}%, ${kind === 'keep' ? '-60px' : '0'}) rotate(${dx * 10}deg)`;
    c.style.opacity = '0';
    await sleep(170);
  }
  DONE.add(a.id);
  ADS.shift();
  total = Math.max(0, total - 1);
  if (isNew(a)) FRESH = Math.max(0, FRESH - 1);
  if (kind === 'keep') { STARS++; $('nstar').textContent = STARS; } else $('nall').textContent = Math.max(0, (Number($('nall').textContent) || 0) - 1); // kept ones stay in Browse
  cleared(1);
  marketsStale = true;
  const saved = setStatus(a.id, kind === 'keep' ? 'starred' : kind);
  LAST = { a, kind, reasons: new Set(), saved: saved.catch(() => {}) };
  renderInbox();
  deciding = false;
  try {
    await saved;
  } catch (err) {
    DONE.delete(a.id);
    cleared(-1);
    LAST = null;
    toast('Could not save: ' + err.message, '');
    load();
    return;
  }
  if (ADS.length < 4 && total > ADS.length) load();
}
$('tri').addEventListener('click', (e) => { const b = e.target.closest('[data-tri]'); if (b) decide(b.dataset.tri); });
$('zero').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) goView(b.dataset.go); });
// Swipe the card: right = made ad, left = reject (up and down still scroll).
let drag = null;
$('grid').addEventListener('pointerdown', (e) => {
  if (st.view !== 'inbox' || e.button > 0 || e.target.closest('a, button, video')) return;
  const c = e.target.closest('.card');
  if (c) drag = { c, x: e.clientX, y: e.clientY, dx: 0, on: false, id: e.pointerId };
});
$('grid').addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.on) {
    if (Math.abs(dx) < 12) return;
    if (Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
    drag.on = true;
    drag.c.classList.add('drag');
    getSelection().removeAllRanges(); // a mouse swipe over the text is not a text selection
    try { drag.c.setPointerCapture(e.pointerId); } catch (err) { /* fine without */ }
  }
  drag.dx = dx;
  drag.c.style.transform = `translateX(${dx}px) rotate(${(dx / 24).toFixed(1)}deg)`;
  drag.c.dataset.lean = dx > 70 ? 'seen' : dx < -70 ? 'rejected' : '';
});
const drop = () => {
  const d = drag;
  drag = null;
  if (!d || !d.on) return;
  if (Math.abs(d.dx) > 100) { decide(d.dx > 0 ? 'seen' : 'rejected', d.dx > 0 ? 1 : -1); return; }
  d.c.classList.remove('drag');
  d.c.style.transform = '';
  delete d.c.dataset.lean;
};
$('grid').addEventListener('pointerup', drop);
$('grid').addEventListener('pointercancel', drop);

// ---- Why? After each decision: one tap on a reason (and a note if you like). The board learns from it (🧠).
const REASON_LABELS = {
  bad: { price: 'Too expensive', saturated: 'Saturated', niche: 'Not my niche', quality: 'Looks low quality', store: 'Bad store', ship: 'Hard to ship', ad: 'Weak ad' },
  good: { wow: 'Wow product', margin: 'Good margin', ad: 'Strong ad', niche: 'My niche', easy: 'Easy to ship' },
};
const VERB = { seen: '✓ Made ad', keep: '★ Kept', rejected: '✗ Rejected', note: '📝 Note' };
let LAST = null; // the last decision: { a, kind, reasons, saved }
function renderWhy() {
  const w = LAST;
  $('why').hidden = !w;
  if (!w) return;
  const labels = REASON_LABELS[w.kind === 'rejected' ? 'bad' : 'good'];
  $('why').innerHTML = `<div class="wh"><span><b>${esc(VERB[w.kind])}</b> · ${esc(nice(w.a))}</span><button data-w="undo">Undo</button></div>
    <div class="wq">${w.kind === 'rejected' ? 'Why not?' : 'Why?'}<small>tap: the board learns</small></div>
    <div class="wc">${Object.entries(labels).map(([k, l], i) => `<button class="rc" data-r="${k}" aria-pressed="${w.reasons.has(k)}" title="Key ${i + 1}">${esc(l)}</button>`).join('')}</div>`;
}
async function sendFeedback(body) {
  const res = await fetch('/api/feedback', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
}
async function toggleReason(k) {
  const w = LAST;
  if (!w) return;
  w.reasons.has(k) ? w.reasons.delete(k) : w.reasons.add(k);
  renderWhy();
  await w.saved;
  try { await sendFeedback({ ad_id: w.a.id, reasons: [...w.reasons] }); } catch (e) { toast('Could not save the reason: ' + e.message, ''); }
}
async function undoLast() {
  const w = LAST;
  if (!w) return;
  LAST = null;
  if (DONE.delete(w.a.id)) cleared(-1);
  renderWhy();
  await w.saved;
  try { await setStatus(w.a.id, w.kind === 'keep' ? 'unstarred' : 'none'); } catch (e) { /* shown by the reload */ }
  load();
}
$('why').addEventListener('click', (e) => {
  const r = e.target.closest('[data-r]');
  if (r) { toggleReason(r.dataset.r); return; }
  const b = e.target.closest('[data-w]');
  if (b && b.dataset.w === 'undo') undoLast();
});

    <section class="lsec"><h3>Your notes</h3>${j.notes.length ? `<div class="lnotes">${j.notes.map((n) => `<div>${esc(n.note)}<small>${esc(n.title ? (VERB[n.action] || '') + ' · ' + n.title : 'About the board')} · ${esc(ago(n.at))}</small></div>`).join('')}</div>` : '<p>No notes yet.</p>'}</section>
    <section class="lsec"><h3>Tell the board something</h3><form class="lnote" id="lnote"><textarea id="lgen" maxlength="1000" placeholder="An idea, a wish, something that bugs you…" aria-label="Feedback"></textarea><button>Save</button></form></section>

function header(j) {
  $('nin').textContent = j.counts.inbox || '';
  $('nall').textContent = j.counts.all;
  $('nstar').textContent = j.counts.starred || '';
  FRESH = j.counts.fresh || 0;
  STARS = j.counts.starred || 0;
  const al = j.alert;
  $('alert').hidden = !al;
  $('alert').className = 'alert' + (al && al.level === 'yellow' ? ' yellow' : '');
  $('alert').textContent = al ? al.text : '';
  const r = j.last_run;
  const box = $('runbox');
  HUNTING = !!r && r.status === 'running';
  if (!r) { box.className = 'status'; $('run').textContent = 'No run yet'; return; }
  if (r.status === 'running') {
    // last_run is saved after every batch: no update for 45 minutes is a run that does not move.
    const still = Date.now() - Date.parse(r.updated_at || r.started_at) > 45 * 60000;
    box.className = 'status ' + (still ? 'warn' : 'live');
    const prev = j.prev_run ? ` · run before: ${fmt(j.prev_run.winners ?? 0)} new winners, ${ago(j.prev_run.finished_at)}` : '';
    const since = ago(r.updated_at || r.started_at).replace(' ago', '');
    $('run').textContent = still
      ? `Run stuck? Started ${ago(r.started_at)} · ${r.ads_checked ? `${fmt(r.ads_checked)} ads, no progress for ${since}` : 'no ads checked yet'}${prev}`
      : `Hunting now · started ${ago(r.started_at)} · ${fmt(r.ads_checked)} ads so far${prev}`;
    return;
  }
  box.className = 'status ' + (r.health === 'failed' ? 'bad' : r.health === 'warning' ? 'warn' : 'ok');
  const why = { 'meta-block': ' · Meta limit', token: ' · Meta token expired!', time: '', done: '' }[r.status] || '';
  $('run').innerHTML = `Last run <b>${esc(ago(r.finished_at || r.updated_at))}</b> · ${esc(fmt(r.ads_checked))} ads · <b>${esc(r.new_winners ?? 0)}</b> new winners${esc(why)}`;
}

let seq = 0;
async function load(append) {
  if (st.view === 'learned') { seq++; loadLearned(); return; }
  const my = ++seq;
  if (!append) {
    st.offset = 0;
    if (!ADS.length) $('grid').innerHTML = SKELETON;
  }
  loading = true;
  try {
    const res = await fetch('/api/ads?' + params({ offset: String(st.offset) }).toString(), { credentials: 'same-origin', headers: { Accept: 'application/json' } });
    if (res.status === 401) { location.reload(); return; }
    const j = await res.json();
    if (my !== seq) return;
    if (!res.ok) throw new Error(j.error || 'HTTP ' + res.status);
    const got = st.view === 'inbox' ? j.ads.filter((a) => !DONE.has(a.id)) : j.ads;
    ADS = append ? ADS.concat(got) : got;
    VIEWER = !!j.viewer;
    total = j.total - (j.ads.length - got.length);
    header(j);
    if (st.view === 'inbox') FRESH = Math.max(0, FRESH - j.ads.filter((a) => DONE.has(a.id) && isNew(a)).length);
    render(append, got);
    radar();
  } catch (e) {
    if (my !== seq) return;
    if (!append) $('grid').innerHTML = '';
    $('empty').hidden = false;
    $('empty').textContent = 'Could not load the products: ' + e.message;
    $('count').textContent = '';
  } finally {
    if (my === seq) loading = false;
  }
}

async function setStatus(id, status) {
  const res = await fetch('/api/hide', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ad_id: id, status }) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
}

let undoId = '';
let undoStatus = 'none';
let toastTimer = 0;
function toast(msg, id, back) {
  undoId = id;
  undoStatus = back || 'none';
  $('toastMsg').textContent = msg;
  $('undo').hidden = !id;
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').hidden = true; }, 5000);
}
$('undo').addEventListener('click', async () => {
  $('toast').hidden = true;
  if (!undoId) return;
  const id = undoId;
  if (DONE.delete(id)) cleared(-1);
  try { await setStatus(id, undoStatus); } catch (e) { /* shown by the reload */ }
  load();
  loadMarkets();
});

$('grid').addEventListener('click', async (e) => {
  const c = e.target.closest('.card');
  if (!c) return;
  const id = c.dataset.id;
  const a = ADS.find((x) => x.id === id);
  const b = e.target.closest('[data-act]');
  if (b && a) {
    const act = b.dataset.act;
    if (act === 'view') { openAd(a); return; }
    try {
      if (act === 'star') {
        await setStatus(id, a.star ? 'unstarred' : 'starred');
        a.star = !a.star;
        b.setAttribute('aria-pressed', String(a.star));
        const n = Math.max(0, (Number($('nstar').textContent) || 0) + (a.star ? 1 : -1));
        $('nstar').textContent = n || '';
        if (st.view === 'starred' && !a.star) load();
        return;
      }
      c.classList.add('gone'); // right away; back if saving fails
      try { await setStatus(id, act); } catch (err) { c.classList.remove('gone'); throw err; }
      if (act !== 'none') toast(act === 'seen' ? 'Marked seen' : 'Rejected', id);
      setTimeout(load, 220);
      loadMarkets();
    } catch (err) {
      toast('Could not save: ' + err.message, '');
    }
    return;
  }
  if (e.target.closest('a, button, input, select') || st.view === 'inbox') return;
  opened.has(id) ? opened.delete(id) : opened.add(id);
  c.classList.toggle('open', opened.has(id));
});

// ---- The ad viewer: the ▶ button opens the ad (video, images, text, CTA) in a sheet on this page.
const link = (u) => (typeof u === 'string' && /^https?:\/\//i.test(u) ? esc(u) : '');
const VIEWS = new Map();
let shown = null;
function mediaHtml(m) {
  if (!m) return '';
  if (m.type === 'video' && safe(m.src)) {
    return `<video controls playsinline preload="metadata" referrerpolicy="no-referrer"${safe(m.poster) ? ` poster="${safe(m.poster)}"` : ''} src="${safe(m.src)}"></video>`;
  }
  const src = m.type === 'video' ? m.poster : m.src;
  if (!safe(src)) return '';
  return `<img src="${safe(src)}" alt="" referrerpolicy="no-referrer">${m.type === 'video' ? '<span class="vnote">The video only plays in the Ad Library ↗</span>' : ''}`;
}
function boxHtml(b) {
  if (!b || !(b.caption || b.title || b.description || b.cta || b.url)) return '';
  const u = link(b.url);
  const cta = u ? `<a class="cta" href="${u}" target="_blank" rel="noopener noreferrer">${esc(b.cta || 'Open ↗')}</a>` : b.cta ? `<span class="cta">${esc(b.cta)}</span>` : '';
  return `<div class="lbox"><div class="lt">${b.caption ? `<small>${esc(b.caption)}</small>` : ''}${b.title ? `<b>${esc(b.title)}</b>` : ''}${b.description ? `<span>${esc(b.description)}</span>` : ''}</div>${cta}</div>`;
}
function adHtml(d) {
  const media = d.cards && d.cards.length
    ? `<div class="car">${d.cards.map((c) => `<div class="cc">${mediaHtml(c.media)}${boxHtml(c)}</div>`).join('')}</div>`
    : `<div class="fbm">${(d.media || []).map(mediaHtml).join('')}</div>${boxHtml(d.link)}`;
  return `<article class="fb">
    <div class="fbh">${safe(d.avatar) ? `<img src="${safe(d.avatar)}" alt="" referrerpolicy="no-referrer">` : ''}<div><b>${esc(d.name || 'Advertiser')}</b><small>Sponsored · Library ID: ${esc(d.library_id || d.id)}</small></div></div>
    ${d.body ? `<p class="fbt" id="fbt">${esc(d.body)}</p><button class="meer" id="meer" hidden>more</button>` : ''}
    ${media}
    ${d.low_impressions ? '<div class="low">Low impression count</div>' : ''}
  </article>`;
}
function errHtml(msg, a) {
  return `<div class="serr"><div>${esc(msg)}</div>${safe(a.ad) ? `<a href="${safe(a.ad)}" target="_blank" rel="noopener noreferrer">Open in Ad Library ↗</a>` : ''}</div>`;
}
function setLink(el, u) {
  el.hidden = !u;
  if (u) el.href = u; else el.removeAttribute('href');
}
async function openAd(a) {
  shown = a;
  setLink($('sLib'), safe(a.ad) ? a.ad : '');
  setLink($('sShop'), safe(a.product) && /\/products\//.test(a.product) ? a.product : safe(a.store) ? a.store : '');
  $('sBody').innerHTML = '<div class="sload"><i class="spin"></i>Loading the ad… (±4 s)</div>';
  $('sheet').hidden = false;
  document.documentElement.classList.add('lock');
  if (!(history.state && history.state.sheet)) history.pushState({ sheet: 1 }, '');
  $('sClose').focus();
  let html;
  try {
    let d = VIEWS.get(a.id);
    if (!d) {
      const res = await fetch('/api/ad/' + encodeURIComponent(a.id), { credentials: 'same-origin', headers: { Accept: 'application/json' } });
      if (res.status === 401) { location.reload(); return; }
      d = await res.json().catch(() => ({ error: 'HTTP ' + res.status }));
      if (!res.ok || d.error) throw new Error(d.error || 'HTTP ' + res.status);
      VIEWS.set(a.id, d);
    }
    html = adHtml(d);
  } catch (e) {
    html = errHtml(e.message, a);
  }
  if (shown !== a) return;
  const shopLine = `${host(a.store)}${a.products != null ? ' · ' + fmt(a.products) + ' products' : ''} · ${a.scaled > 1 ? fmt(a.scaled) + ' ads for this product' : '1 ad for this product'} · ${fmt(a.reach)} EU reach`;
  $('sBody').innerHTML = `<p class="sinfo">${esc(shopLine)}</p>` + html;
  const t = $('fbt');
  if (t && t.scrollHeight > t.clientHeight + 2) $('meer').hidden = false;
}
function hideAd() {
  shown = null;
  $('sheet').hidden = true;
  $('sBody').innerHTML = ''; // stops a playing video
  document.documentElement.classList.remove('lock');
}
function closeAd() {
  if (history.state && history.state.sheet) history.back(); // popstate hides it; an iOS back-swipe does the same
  else hideAd();
}
window.addEventListener('popstate', () => { if (!$('sheet').hidden) hideAd(); });
$('sClose').addEventListener('click', closeAd);
$('scrim').addEventListener('click', closeAd);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('sheet').hidden) closeAd();
  // "/" jumps to the search (not while typing somewhere)
  if (e.key === '/' && $('sheet').hidden && st.view === 'all' && !e.target.closest('input, select, textarea')) { e.preventDefault(); $('q').focus(); }
  // Inbox: R / ← reject, K / ↑ keep, D / → made ad, Enter or V: the ad in the Facebook Ad Library
  if (st.view !== 'inbox' || !$('sheet').hidden || e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, select, textarea')) return;
  if (LAST && /^[1-9]$/.test(e.key)) {
    const k = Object.keys(REASON_LABELS[LAST.kind === 'rejected' ? 'bad' : 'good'])[Number(e.key) - 1];
    if (k) { e.preventDefault(); toggleReason(k); }
    return;
  }
  if (e.key.toLowerCase() === 'n' && ADS[0]) { e.preventDefault(); $('pn').focus(); return; }
  const kind = { r: 'rejected', ArrowLeft: 'rejected', k: 'keep', ArrowUp: 'keep', d: 'seen', ArrowRight: 'seen' }[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (kind) { e.preventDefault(); decide(kind); return; }
  if ((e.key === 'Enter' || e.key.toLowerCase() === 'v') && ADS[0] && !e.target.closest('a, button')) { e.preventDefault(); if (safe(ADS[0].ad)) window.open(ADS[0].ad, '_blank', 'noopener'); }
});
$('sBody').addEventListener('click', (e) => {
  if (e.target.id !== 'meer') return;
  $('fbt').classList.add('full');
  e.target.hidden = true;
});
$('sBody').addEventListener('error', (e) => { if (e.target instanceof HTMLImageElement) e.target.remove(); }, true);

// A photo the store no longer serves: show the shop name instead.
$('grid').addEventListener('error', (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement)) return;
  const ph = img.closest('.ph');
  const a = ADS.find((x) => x.id === img.closest('.card').dataset.id);
  const d = document.createElement('div');
  d.className = 'dom';
  d.textContent = (a && (host(a.store) || a.adv)) || '';
  img.remove();
  for (const t of ph.querySelectorAll('.tag.sp')) t.remove();
  ph.prepend(d);
}, true);

function goView(v) {
  if (st.view === v) return;
  st.view = v;
  ADS = [];
  if (v === 'learned') LEARNED = null;
  load();
  if (v === 'all' && marketsStale) { marketsStale = false; loadMarkets(); }
  window.scrollTo({ top: 0 });
}
for (const b of document.querySelectorAll('[data-view]')) b.addEventListener('click', () => goView(b.dataset.view));
for (const b of document.querySelectorAll('[data-f]')) {
  b.addEventListener('click', () => {
    const f = b.dataset.f;
    st[f] = !st[f];
    if (f === 'r10k' && st.r10k) st.r2500 = false;
    if (f === 'r2500' && st.r2500) st.r10k = false;
    load();
  });
}
let qTimer = 0;
$('q').addEventListener('input', (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { st.q = e.target.value.trim(); load(); }, 300); });
$('sort').addEventListener('change', (e) => { st.sort = e.target.value; load(); });
const more = () => { if (loading || $('moreBtn').hidden) return; st.offset = ADS.length; load(true); };
$('moreBtn').addEventListener('click', more);
// Endless scroll: the next page loads before you reach the end.
if ('IntersectionObserver' in window) new IntersectionObserver((es) => { if (es.some((x) => x.isIntersecting)) more(); }, { rootMargin: '900px 0px' }).observe($('loadmore'));
// Desktop: cards lean toward the pointer (CSS variables through the CSSOM: the CSP blocks style attributes).
if (!calm && window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches) {
  let lean = null;
  const flat = () => { if (!lean) return; for (const k of ['--rx', '--ry', '--gx', '--gy']) lean.style.removeProperty(k); lean.classList.remove('tilt'); lean = null; };
  $('grid').addEventListener('pointermove', (e) => {
    const c = e.target.closest('.card:not(.open)');
    if (c !== lean) flat();
    if (!c) return;
    lean = c;
    const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    c.classList.add('tilt');
    c.style.setProperty('--rx', ((0.5 - y) * 7).toFixed(2) + 'deg');
    c.style.setProperty('--ry', ((x - 0.5) * 7).toFixed(2) + 'deg');
    c.style.setProperty('--gx', (x * 100).toFixed(0) + '%');
    c.style.setProperty('--gy', (y * 100).toFixed(0) + '%');
  });
  $('grid').addEventListener('pointerleave', flat);
}
load();
loadMarkets();
</script>
</body>
