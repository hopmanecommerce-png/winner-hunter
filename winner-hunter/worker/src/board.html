<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141415">
<meta name="color-scheme" content="dark">
<title>Winner Hunter</title>
<link rel="stylesheet" nonce="__NONCE__" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script nonce="__NONCE__" src="/launch.js" id="lnkit" defer></script>
<script nonce="__NONCE__" src="/supplier.js" id="spkit" defer></script>
<style nonce="__NONCE__">
  :root {
    color-scheme: dark;
    /* Field ledger: graphite surfaces, one amber accent. unslop by Damir Sokolovsky (@heydamir, github.com/heydamir/unslop), CC BY 4.0. */
    --bg: #141415; --deep: #0f0f10; --card: #19191b; --card2: #232325; --glass: #19191b;
    --ink: #ededed; --muted: #a1a1a6; --faint: #85858b; --line: rgba(237, 237, 237, .08); --line2: rgba(237, 237, 237, .16);
    --acc: #d9a441; --cy: var(--acc); --vi: var(--acc); --mg: var(--acc); --holo: linear-gradient(var(--acc), var(--acc));
    --win: #4cc38a; --bad: #e5484d; --amb: #d9a441; --link: #ededed;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --r: 12px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; background: var(--bg); }
  body { margin: 0; min-height: 100vh; color: var(--ink); font: 15px/1.4 var(--sans); -webkit-font-smoothing: antialiased; background: var(--bg); overflow-x: hidden; }
        button, input, select { font: inherit; color: inherit; }
  button { -webkit-user-select: none; user-select: none; }
  svg { display: block; }
  :focus-visible { outline: 2px solid var(--cy); outline-offset: 2px; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 56px max(16px, env(safe-area-inset-left)); }
  .kick { font: 600 11px/1 var(--mono); color: var(--muted); }
  
  /* Top: name, run status, export, log out */
  .top { display: flex; align-items: center; gap: 12px; padding: 8px 0 12px; }
  .brand { display: grid; gap: 4px; min-width: 0; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; white-space: nowrap; line-height: 1; }
  .tools { margin-left: auto; display: flex; gap: 8px; }
  .ic { height: 36px; min-width: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--glass); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 12px var(--mono); text-decoration: none; cursor: pointer; transition: border-color .2s, box-shadow .2s; }
  .ic:hover { border-color: var(--cy); }
  .status { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; margin: 0 0 16px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--glass);
    font: 500 11px/1.35 var(--mono); color: var(--muted); }
  .status .run { overflow-wrap: anywhere; }
  .run b { color: var(--ink); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: 0 0 7px; }
  .status.ok .dot { background: var(--win); }
  .status.live .dot { background: var(--cy); animation: blink 1.4s ease-in-out infinite; }
  .status.warn { border-color: rgba(217, 164, 65, .35); }
  .status.warn .dot { background: var(--amb); }
  .status.warn .run { color: var(--amb); }
  .status.bad .dot { background: var(--bad); }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .alert { margin: 0 0 12px; padding: 12px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; overflow-wrap: anywhere; color: #fff; }
  .alert.yellow { color: #1a1406; }

  /* Market Radar */
  .radar { position: relative; border-radius: 24px; padding: 20px; margin-bottom: 16px; overflow: hidden; border: 1px solid transparent; }
  .rh { position: relative; z-index: 1; display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .rh .sub { color: var(--faint); font: 500 11px var(--mono); }
  .rh button { margin-left: auto; }
  .rtop { position: relative; z-index: 1; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; padding: 4px 0 16px; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; }
  .ring { position: relative; width: 104px; height: 104px; isolation: isolate; }
          .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .trk { stroke: rgba(237, 237, 237, .12); }
  .ring .val { stroke: var(--acc); transition: stroke-dasharray .8s cubic-bezier(.2, .8, .2, 1); }
  .ring .fl { position: absolute; inset: 0; display: grid; place-items: center; font-size: 38px; line-height: 1; }
  .rnum { display: grid; gap: 4px; min-width: 0; }
  .rnum .nm { font-size: 30px; font-weight: 600; line-height: 1.02; overflow-wrap: anywhere; }
  .rnum .big { font-size: 15px; color: var(--ink); font-weight: 600; }
  .rnum .big b { font-size: 22px; font-weight: 600; }
  .rnum .lead { color: var(--muted); font-size: 13px; }
  .rlist { position: relative; z-index: 1; list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .mk { width: 100%; display: grid; grid-template-columns: 22px 26px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; border: 1px solid transparent; background: none; cursor: pointer; text-align: left; transition: background .2s, border-color .2s; }
  .mk:hover { background: var(--card2); }
  .mk[aria-pressed="true"] { border-color: var(--cy); background: rgba(217, 164, 65, .07); }
  .mk .rk { font: 600 11px var(--mono); color: var(--faint); }
  .mk .fl { font-size: 20px; line-height: 1; }
  .mk .mid { min-width: 0; display: grid; gap: 4px; }
  .mk .nm { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mk .nm small { color: var(--faint); font: 500 11px var(--mono); margin-left: 8px; }
  .bar { height: 5px; border-radius: 2px; background: rgba(237, 237, 237, .1); overflow: hidden; }
  .bar i { display: block; height: 100%; width: var(--w, 0%); border-radius: inherit; background: var(--holo); transition: width .9s cubic-bezier(.2, .8, .2, 1); }
  .mk .vv { text-align: right; font-variant-numeric: tabular-nums; }
  .mk .vv b { display: block; font-size: 14px; font-weight: 600; }
  .mk .vv span { font: 500 11px var(--mono); color: var(--muted); }
  .rfoot { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-top: 12px; color: var(--faint); font: 500 11px/1.4 var(--mono); }
  .ghost { border: 1px solid var(--line); background: var(--card2); color: var(--ink); border-radius: 8px; height: 32px; padding: 0 12px; font: 600 11px var(--mono); cursor: pointer; white-space: nowrap; transition: border-color .2s; }
  .ghost:hover { border-color: var(--cy); }
  .radar.min .rbody, .radar.min .rfoot { display: none; }
  .rviews { position: relative; z-index: 1; display: grid; gap: 12px; min-width: 0; }
  .rtabs { display: inline-flex; justify-self: start; padding: 4px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); }
  .rtabs button { border: 0; background: none; border-radius: 9px; height: 30px; padding: 0 12px; color: var(--muted); font: 600 11px var(--mono); cursor: pointer; }
  .rtabs button[aria-pressed="true"] { color: var(--ink); background: rgba(217, 164, 65, .1); }
  .radar[data-rv="list"] .hexmap, .radar[data-rv="map"] .rlist { display: none; }
  /* Europe as glowing hexagons: the more reach a day, the brighter. */
  .hexmap { display: grid; place-items: center; min-width: 0; }
  .hexmap svg { width: 100%; max-width: 360px; height: auto; overflow: visible; }
  .hexmap .hx { cursor: pointer; transition: opacity .2s; }
  .hexmap .hx.off { cursor: default; }
  .hexmap .hx polygon { stroke: rgba(237, 237, 237, .2); stroke-width: 1; transition: stroke .2s; }
  .hexmap .hx:not(.off):hover polygon { stroke: var(--cy); }
  .hexmap .hx.on polygon { stroke: #fff; stroke-width: 1.8; }
      .hexmap text { font: 600 11px var(--mono); fill: rgba(238, 241, 255, .9); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .hexmap .hx.off text { fill: rgba(237, 237, 237, .35); }
  .hexmap .lg { display: flex; justify-content: space-between; width: 100%; max-width: 360px; margin-top: 8px; font: 500 11px var(--mono); color: var(--faint); }
  .hexmap .lg i { flex: 1; height: 4px; margin: 4px 12px 0; border-radius: 9px; }
  .radar.min .rh { margin: 0; }

  /* The sticky rail: view, search, filters */
  .rail { position: sticky; top: 0; z-index: 5; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left))); padding: 12px max(16px, env(safe-area-inset-left)); display: grid; gap: 12px;
    background: rgba(15, 15, 16, .72); border-bottom: 1px solid var(--line); }
  .bar2 { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .seg { display: inline-flex; padding: 4px; border-radius: 14px; background: var(--card2); border: 1px solid var(--line); flex: 0 0 auto; }
  .seg button { border: 0; background: none; border-radius: 11px; padding: 0 12px; height: 34px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background .2s, color .2s, box-shadow .2s; }
  .seg button[aria-pressed="true"] { background: rgba(217, 164, 65, .1); color: var(--ink); }
  .seg small { font: 600 11px var(--mono); color: var(--faint); }
  .seg button[aria-pressed="true"] small { color: var(--cy); }
  .seg .ok { color: var(--win); font-style: normal; } /* ✓ Approved: the green of the Approved button */
      .count { color: var(--muted); font: 500 11px var(--mono); white-space: nowrap; margin-top: -2px; }
  .find { display: contents; }
  .search { position: relative; display: block; min-width: 0; flex: 1 1 auto; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  input[type="search"] { width: 100%; height: 42px; border-radius: 14px; border: 1px solid var(--line); background: var(--card2); padding: 0 12px 0 36px; font-size: 15px; outline: none; transition: border-color .2s, box-shadow .2s; -webkit-appearance: none; appearance: none; }
  input[type="search"]::placeholder { color: var(--faint); }
  input[type="search"]:focus { border-color: var(--cy); }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left))); padding: 0 max(16px, env(safe-area-inset-left)); }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card2); font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; transition: background .2s, color .2s, border-color .2s, box-shadow .2s; }
  .chip:hover { border-color: var(--line2); }
  .chip[aria-pressed="true"] { background: var(--holo); border-color: transparent; color: #141415; }
  .chip.ccx { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); border-color: var(--cy); background: rgba(217, 164, 65, .1); }
  .chip.ccx b { font-size: 16px; line-height: 1; }
  .selw { position: relative; flex: 0 0 auto; display: inline-flex; }
  .selw::after { content: ''; position: absolute; right: 13px; top: 12px; width: 5px; height: 5px; border: solid var(--faint); border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); pointer-events: none; }
  select.chip { -webkit-appearance: none; appearance: none; padding-right: 30px; color: var(--ink); background: var(--card2); }
  select.chip option { background: #0b0d18; }

  /* Cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); grid-auto-flow: row dense; gap: 16px; margin-top: 16px; }
  .card { position: relative; border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; min-width: 0; cursor: pointer; border: 1px solid transparent; transition: opacity .25s, transform .25s, box-shadow .3s; }
  /* Desktop: the card leans toward the pointer, with a glare where the light hits. */
  .card::after { content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .3s; border-radius: inherit; }
  .card.tilt::after { opacity: 1; }
    @media (hover: hover) {
    .card:hover { }
    .card:hover .ph img { transform: scale(1.04); }
    .acts .ok:hover { border-color: rgba(76, 195, 138, .5); }
    .acts .no:hover { border-color: rgba(229, 72, 77, .5); }
  }
  .card.gone { opacity: 0; transform: scale(.94) translateY(6px); pointer-events: none; }
    .ph { position: relative; aspect-ratio: 1 / 1; background: #0f1222; display: grid; place-items: center; overflow: hidden; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
  .ph::after { content: ''; position: absolute; inset: 52% 0 0; background: linear-gradient(to top, rgba(15, 15, 16, .86), rgba(15, 15, 16, .35) 50%, rgba(15, 15, 16, 0)); pointer-events: none; }
  .ph .dom { font: 600 12px var(--mono); color: var(--muted); padding: 12px; text-align: center; overflow-wrap: anywhere; }
  .badges { position: absolute; left: 8px; top: 8px; right: 52px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 1; }
  .tag { font: 600 11px/1 var(--mono); color: #fff; background: rgba(15, 15, 16, .55); border: 1px solid rgba(255, 255, 255, .12); border-radius: 8px; padding: 4px 8px; white-space: nowrap; }
  .tag.new { background: var(--holo); color: #141415; border: 0; }
  .tag.out { background: rgba(217, 164, 65, .9); color: #1a1406; border: 0; }
  .tag.made { background: rgba(4, 30, 20, .7); color: var(--win); border-color: rgba(76, 195, 138, .45); }
  .tag.sp { padding: 4px 8px; opacity: .85; }
  .tag.sp svg { display: block; }
  .view:active { transform: scale(.88); }
  .hero { position: absolute; left: 11px; bottom: 10px; z-index: 1; color: #fff; display: grid; line-height: 1; pointer-events: none; }
  .hero b { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .hero span { font: 600 11px var(--mono); color: var(--cy); margin-top: 4px; }
  .view { position: absolute; right: 9px; bottom: 9px; z-index: 1; width: 42px; height: 42px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; color: #141415; background: var(--holo); text-decoration: none; transition: transform .2s; }
  .view svg { margin-left: 2px; }
  .bd { padding: 12px 12px 4px; display: grid; gap: 8px; min-width: 0; align-content: start; }
  .t { margin: 0; font-size: 14px; font-weight: 500; line-height: 1.28; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .price { font-size: 14px; font-weight: 600; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; font-variant-numeric: tabular-nums; }
  .price s { color: var(--faint); font-size: 12px; font-weight: 500; }
  .off { color: var(--win); font: 600 11px var(--mono); }
  .flags { display: flex; gap: 4px; flex-wrap: wrap; min-width: 0; }
  .flags span { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px 4px 4px; border-radius: 8px; background: var(--card2); border: 1px solid var(--line); font: 600 11px var(--mono); color: var(--muted); }
  .flags span i { font-style: normal; font-size: 13px; line-height: 1; }
  .flags span.hit { color: var(--ink); border-color: var(--cy); background: rgba(217, 164, 65, .1); }
  .meta { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .8fr) minmax(0, 1fr); background: var(--card2); border: 1px solid var(--line); border-radius: 13px; padding: 8px 0; }
  .m { min-width: 0; padding: 0 8px; }
  .m + .m { border-left: 1px solid var(--line); }
  .m b { display: block; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m span { display: block; font: 500 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who.ln { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; overflow: visible; }
  .who.ln > * { flex: none; white-space: nowrap; }
  .who.ln a { color: var(--ink); text-decoration: none; font-weight: 600; padding: 12px 8px; margin: -10px -6px; }
  .who.ln a:hover { text-decoration: underline; }
  .who.ln .shop { flex: 1 1 100%; max-width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .who.ln .src { margin-left: auto; color: var(--mg); }
  .bs { font-size: 12px; margin-top: 4px; color: var(--ink); }
  .bs.top { color: var(--win); font-weight: 600; }
  .bs.no { color: var(--faint); }
  .acts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; padding: 8px 12px 12px; margin-top: auto; }
  @media (max-width: 560px) { .acts button svg { display: none; } .acts button { padding-left: 2px; padding-right: 2px; } } /* two columns on a phone: "Approved" and "Reject" must both fit */
  .acts button { border: 1px solid var(--line); background: var(--card2); border-radius: 12px; height: 36px; font-weight: 500; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; transition: border-color .2s, box-shadow .2s, background .2s; }
  .acts .ok { color: var(--win); }
  .acts .no { color: var(--bad); }
  .acts .un { grid-column: 1 / -1; color: var(--ink); }
  .more, .links { display: none; }
  .card.open { grid-column: 1 / -1; cursor: default; }
  .card.open .more { display: grid; gap: 8px; font-size: 13px; color: var(--muted); }
  .card.open .links { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 12px 0; }
  .card.open .t { -webkit-line-clamp: 4; font-size: 18px; }
  .card.open .who { white-space: normal; }
  .links a { color: var(--ink); text-decoration: none; border: 1px solid var(--line); background: var(--card2); border-radius: 12px; padding: 8px 12px; font-weight: 500; font-size: 13px; transition: border-color .2s; }
  .links a:hover { border-color: var(--line2); }
  .links a.pri { background: var(--holo); color: #141415; border-color: transparent; }
  .more p { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 500 12px var(--mono); }
  .facts span b { color: var(--ink); font-weight: 600; }

  /* Loading, empty, more */
  .skel { border-radius: var(--r); overflow: hidden; background: var(--card); border: 1px solid var(--line); }
  .skel i { display: block; animation: shimmer 1.4s linear infinite; }
  .skel .p { aspect-ratio: 1 / 1; }
  .skel .l { height: 12px; margin: 12px 12px 0; border-radius: 6px; }
  .skel .l.s { width: 55%; margin-bottom: 16px; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .empty { text-align: center; color: var(--muted); padding: 56px 16px; display: grid; justify-items: center; gap: 12px; }
  .empty svg { color: var(--vi); }
  .loadmore { display: flex; justify-content: center; margin-top: 20px; min-height: 1px; }
  .loadmore button { background: var(--card2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; height: 40px; padding: 0 20px; font: 600 12px var(--mono); cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10; max-width: calc(100vw - 32px); border: 1px solid transparent; color: var(--ink);
    border-radius: 16px; padding: 8px 8px 8px 16px; display: flex; gap: 12px; align-items: center; font-weight: 600; font-size: 14px; animation: up .3s cubic-bezier(.2, .8, .2, 1); }
  @keyframes up { from { opacity: 0; transform: translate(-50%, 14px); } }
  .toast button { background: rgba(217, 164, 65, .14); border: 0; color: var(--cy); font: 600 12px var(--mono); cursor: pointer; padding: 8px 12px; border-radius: 10px; }

  .sload { display: grid; justify-items: center; gap: 16px; padding: 80px 0; color: var(--muted); font: 600 12px var(--mono); }
  .spin { width: 36px; height: 36px; border-radius: 50%; background: conic-gradient(from 0deg, transparent, var(--cy), var(--mg)); -webkit-mask: radial-gradient(circle, transparent 13px, #000 14px); mask: radial-gradient(circle, transparent 13px, #000 14px); animation: spin .8s linear infinite; }

  /* Inbox: one product at a time until none are left */
  .ibox { max-width: 760px; margin: 16px auto 0; display: grid; gap: 8px; }
  .ihead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .ihead b { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ihead span { font: 600 11px var(--mono); color: var(--cy); }
  .ibar { height: 6px; border-radius: 9px; background: var(--card2); border: 1px solid var(--line); overflow: hidden; }
  .ibar i { display: block; height: 100%; width: var(--w, 0%); background: var(--holo); transition: width .4s; }
  .grid.one { grid-template-columns: minmax(0, 1fr); max-width: 760px; margin-left: auto; margin-right: auto; }
  .grid.one .card { touch-action: pan-y; transition: transform .18s ease-in, opacity .18s, box-shadow .2s; }

  .tags { display: flex; flex-wrap: wrap; gap: 4px; }

if ('IntersectionObserver' in window) new IntersectionObserver((es) => { if (es.some((x) => x.isIntersecting)) more(); }, { rootMargin: '900px 0px' }).observe($('loadmore'));
// ---- 🚀 Launch: from an approved product to a test campaign today. One launch card per product (launch.mjs): the
// decision on top (margin, break-even ROAS, how long its ads run, store size, risk flags: Go or No go in ten seconds)
// and the seven-step checklist under it. The numbers are worked out as you type by the code the server runs too
// (/launch.js: window.LAUNCH). Each step saves on its own, one save after the other.
// tab: 'launch' (the launch cards) or 'supplier' (🏭 Suppliers, below: its own box, #spbox).
const LN = { list: null, focus: '', pick: null, picking: false, open: new Set(), timers: new Map(), chain: Promise.resolve(), saving: 0, tab: 'launch' };
const lnReady = new Promise((ok, no) => {
  if (window.LAUNCH) { ok(); return; }
  $('lnkit').addEventListener('load', () => (window.LAUNCH ? ok() : no(new Error('the launch code did not run'))), { once: true });
  $('lnkit').addEventListener('error', () => no(new Error('the launch code did not load')), { once: true });
});
lnReady.catch(() => {}); // said when the view opens
const LN_SRC = { eu: 'EU', world: 'Outside EU', tiktok: 'TikTok' };
const lnEur = (v) => (v == null ? '–' : (v < 0 ? '−' : '') + money(Math.abs(v), 'EUR'));
const lnFocus = () => (LN.list || []).find((l) => l.key === LN.focus) || null;
const lnImg = (f) => (safe(f.img) ? `<img src="${safe(f.img)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">` : `<i>${esc(String(f.title || '?').slice(0, 1))}</i>`);
const lnA = (u, t) => (safe(u) ? `<a href="${safe(u)}" target="_blank" rel="noopener noreferrer">${esc(t)} ↗</a>` : '');
const lnFill = (s, cur) => `${s.items.filter((f) => cur.v && cur.v[f.k] !== undefined).length}/${s.items.length}`;
const lnSaved = (t) => { const el = $('lnsaved'); if (el) el.textContent = t; };
const lnCount = () => { $('nlaunch').textContent = (LN.list || []).filter((l) => l.decision !== 'no').length || ''; };

async function lnLoad() {
  await LN.chain; // saves on their way land first
  const res = await fetch('/api/launch', { credentials: 'same-origin', headers: { Accept: 'application/json' } });
  if (res.status === 401) { location.reload(); return; }
  const j = await res.json();
  if (!res.ok) throw new Error(j.error || 'HTTP ' + res.status);
  LN.list = j.launches;
  if (!lnFocus()) LN.focus = LN.list.length ? LN.list[0].key : ''; // the launch pin comes first
  if (!LN.list.length) LN.picking = true;
  lnCount();
}
// The view, as 🧠: the hunt's controls and cards step aside (body.lnv), the launch cards come in.
async function lnView() {
  for (const b of document.querySelectorAll('[data-view]')) b.setAttribute('aria-pressed', 'false');
  $('lnseg').setAttribute('aria-pressed', 'true');
  document.body.classList.remove('inbox');
  document.body.classList.add('lnv');
  $('grid').classList.remove('one');
  $('grid').innerHTML = '';
  for (const id of ['allrow', 'allrow2', 'count', 'empty', 'moreBtn', 'ibox', 'dock', 'zero', 'pnote', 'learn']) $(id).hidden = true;
  radar();
  if (LN.tab === 'supplier') { $('lnbox').hidden = true; $('lnbox').innerHTML = ''; spView(); return; }
  $('spbox').hidden = true;
  $('spbox').innerHTML = ''; // one tab's content at a time: nothing of the other one is left in the page
  $('lnbox').hidden = false;
  const shown = LN.list && window.LAUNCH ? JSON.stringify(LN.list) : '';
  if (shown) lnRender();
  else $('lnbox').innerHTML = '<div class="sload"><i class="spin"></i>Loading…</div>';
  try {
    await lnReady;
    await lnLoad();
    if (st.view !== 'launch' || LN.tab === 'supplier') return; // another view, or the Suppliers tab meanwhile
    if (JSON.stringify(LN.list) !== shown) lnRender(); // unchanged: no new render, so a field you tapped keeps its keyboard
    if (LN.picking && !LN.pick) lnPick();
    if (!SP.list) spLoadList().then(spCount, () => {}); // the count on the Suppliers tab
  } catch (e) {
    if (st.view === 'launch' && LN.tab !== 'supplier') $('lnbox').innerHTML = `<p class="lnmuted">Could not load the launch cards: ${esc(e.message)}</p>`;
  }
}
function lnLeave() {
  if (!document.body.classList.contains('lnv')) return;
  lnFlush();
  spFlush();
  document.body.classList.remove('lnv');
  $('lnbox').hidden = true;
  $('spbox').hidden = true;
  $('lnseg').setAttribute('aria-pressed', 'false');
}
// The two tabs of the view: the launch cards and 🏭 Suppliers. Saves on their way go out first.
const lnBarHtml = () => `<div class="lnbar"><div class="lntabs" role="group" aria-label="Launch cards or suppliers"><button data-tab="launch" aria-pressed="${LN.tab !== 'supplier'}">🚀 Launch cards</button><button data-tab="supplier" aria-pressed="${LN.tab === 'supplier'}">🏭 Suppliers <small data-nsup>${SP.list && SP.list.length ? SP.list.length : ''}</small></button></div></div>`;
function lnTab(t) {
  if (LN.tab === t) return;
  LN.tab = t;
  if (t === 'supplier') lnFlush();
  else spFlush();
  lnView();
  window.scrollTo({ top: 0 });
}

function lnRender() {
  const l = lnFocus();
  const others = (LN.list || []).filter((x) => x !== l);
  $('lnbox').innerHTML = `${lnBarHtml()}<div class="lnhead"><h2>Launch</h2><small class="lnsaved" id="lnsaved" aria-live="polite"></small>
      <p>${l ? 'One product, from the supplier to a test campaign. Everything saves as you type.' : 'Pick an approved product: its launch card holds the checklist and the numbers for a go or a no-go.'}</p></div>
    ${l ? lnCardHtml(l) + lnStepsHtml(l) : ''}
    ${others.length ? `<section class="lnother" aria-label="Other launch cards"><h3>Other launch cards</h3>${others.map(lnRowHtml).join('')}</section>` : ''}
    <section class="lnpick" aria-label="Start a launch">${lnPickHtml()}</section>`;
}
// The decision card: the product, its four numbers, the risk flags, the steps done, Go or No go.
function lnCardHtml(l) {
  const f = l.facts;
  const price = f.price != null ? money(f.price, f.cur) + (f.source === 'tiktok' ? ' on TikTok' : ' in their shop') : '';
  const extra = f.source === 'tiktok' ? (f.sold != null ? fmt(f.sold) + ' sold in the US' : '') : f.rpd ? fmt(f.rpd) + ' reach / day' : f.proof ? `${f.proof.n}/${f.proof.of} proof` : '';
  const no = l.decision === 'no';
  return `<article class="lncard${l.decision ? ' ' + l.decision : ''}" data-key="${esc(l.key)}">
    <div class="lntop"><span>${esc((LN_SRC[f.source] || '') + (f.approved_at ? ' · approved ' + day(f.approved_at) : ''))}</span>
      <button class="lnpin" data-ln="pin" aria-pressed="${l.pinned}"${no ? ' disabled' : ''} title="${no ? 'A no-go cannot be the launch pin' : 'The launch pin: the product you launch now, one at a time'}">${l.pinned ? '📌 Launching' : '📌 Pin'}</button></div>
    <div class="lnprod"><span class="lnth big">${lnImg(f)}</span>
      <div class="lnpt"><h3>${esc(l.title || f.title)}</h3><small>${esc([price, host(f.store) || f.adv, extra].filter(Boolean).join(' · '))}</small>
        <div class="lnlinks">${f.source === 'tiktok' ? lnA(f.product, 'TikTok') + lnA(f.ad, 'Meta ads') : lnA(f.ad, 'Ad') + lnA(f.product || f.store, 'Shop')}</div></div></div>
    <div id="lndec">${lnDecHtml(l)}</div>
    <div class="tri lndec" role="group" aria-label="Launch decision">
      <button class="no" data-ld="no" aria-pressed="${no}"><span class="tl">${ICON.x}No go</span></button>
      <button class="ok" data-ld="go" aria-pressed="${l.decision === 'go'}"><span class="tl">${ICON.check}Go</span></button>
    </div>
  </article>`;
}
function lnDecHtml(l) {
  const s = window.LAUNCH.summaryOf(l);
  const m = s.margin;
  const f = l.facts;
  const cell = (cls, v, label, tip) => `<div class="m${cls ? ' ' + cls : ''}" title="${esc(tip)}"><b>${esc(v)}</b><span>${esc(label)}</span></div>`;
  const roas = s.be_roas == null ? (m ? 'low' : '') : s.be_roas < 2 ? 'good' : s.be_roas >= 3 ? 'low' : '';
  const flags = s.flags.length ? s.flags.map((x) => `<li class="${esc(x.level)}">${esc(x.text)}</li>`).join('') : '<li class="green">No risk flags</li>';
  return `<div class="meta m4 lnnums" data-level="${esc(s.level)}">
      ${cell(m ? (m.contribution > 0 ? 'good' : 'low') : '', m ? lnEur(m.contribution) : '–', m ? `margin · ${m.pct}%` : 'margin', 'What one order leaves you before ads: price − VAT − fees − COGS − shipping')}
      ${cell(roas, s.be_roas == null ? '–' : s.be_roas + '×', 'break-even ROAS', 'Below this ROAS the ads cost more than an order leaves')}
      ${cell('', s.ad_days == null ? '–' : s.ad_days + 'd', f.source === 'world' ? 'oldest ad' : 'ads live', f.source === 'tiktok' ? 'TikTok gives no ad dates' : 'How long its ads ran when the launch started')}
      ${cell('', s.store_products == null ? '–' : fmt(s.store_products), 'store products', 'A small store lives on this product; a big one sells everything')}
    </div>
    <ul class="lnflags" aria-label="Risk flags">${flags}</ul>
    <div class="lnprog"><span>${esc(s.done)} of ${esc(s.of)} steps done</span><span class="lnmeter" aria-hidden="true">${Array.from({ length: s.of }, (_, i) => `<i class="${i < s.done ? 'on' : ''}"></i>`).join('')}</span></div>`;
}
// The checklist: a fold per step; the margin step shows its numbers as you type, the launch step suggests its rules.
function lnStepsHtml(l) {
  const K = window.LAUNCH;
  return `<section class="lnsteps" aria-label="Launch checklist">${K.STEPS.map((s, i) => {
    const cur = (l.steps && l.steps[s.k]) || { done: false, note: '', v: {} };
    return `<details class="lnstep${cur.done ? ' done' : ''}" data-step="${s.k}"${LN.open.has(s.k) ? ' open' : ''}>
      <summary><span class="lnn">${cur.done ? '✓' : i + 1}</span><span class="lnst">${esc(s.title)}</span><small data-fill>${esc(lnFill(s, cur))}</small></summary>
      <div class="lnbody">
        <p class="lnhint">${esc(s.hint)}</p>
        ${lnHelp(l, s.k)}
        <div class="lnfields">${s.items.map((f) => lnField(l, s.k, f, cur.v ? cur.v[f.k] : undefined)).join('')}</div>
        ${s.k === 'margin' ? `<div id="lncalc">${lnCalcHtml(l)}</div>` : ''}
        ${s.k === 'launch' ? `<div class="lnsug" id="lnsug">${lnSugHtml(l)}</div>` : ''}
        <label class="lnnote"><span>Notes</span><textarea data-note rows="2" maxlength="1000" placeholder="Anything to remember for this step">${esc(cur.note || '')}</textarea></label>
        <label class="lncheck lndone"><input type="checkbox" data-done${cur.done ? ' checked' : ''}><span>Step done</span></label>
      </div>
    </details>`;
  }).join('')}<button class="lnremove" data-ln="remove">Remove this launch card</button></section>`;
}
function lnField(l, k, f, val) {
  if (f.t === 'tick') return `<label class="lncheck"><input type="checkbox" data-f="${f.k}"${val === true ? ' checked' : ''}><span>${esc(f.label)}</span></label>`;
  if (f.t === 'choice') return `<label class="lnf wide"><span>${esc(f.label)}</span><span class="selw"><select class="chip" data-f="${f.k}"><option value="">Not set</option>${f.options.map(([v, t]) => `<option value="${esc(v)}"${val === v ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></span></label>`;
  const wide = f.t === 'url' || f.t === 'text';
  const ph = esc(lnPh(l, k, f));
  if (f.long) return `<label class="lnf wide"><span>${esc(f.label)}</span><textarea data-f="${f.k}" rows="2" maxlength="500" placeholder="${ph}">${esc(val ?? '')}</textarea></label>`;
  const kind = f.t === 'url' ? 'type="url" inputmode="url" spellcheck="false"' : f.t === 'text' ? 'type="text"' : `type="text" inputmode="${f.t === 'int' ? 'numeric' : 'decimal'}"`;
  return `<label class="lnf${wide ? ' wide' : ''}"><span>${esc(f.label)}</span><input ${kind} data-f="${f.k}" value="${esc(val ?? '')}" placeholder="${ph}" maxlength="${wide ? 500 : 12}" autocomplete="off"></label>`;
}
function lnPh(l, k, f) {
  const src = (l.steps.sourcing && l.steps.sourcing.v) || {};
  if (k === 'margin' && f.k === 'cogs') return src.unit != null ? `${src.unit} from Sourcing` : 'Unit cost';
  if (k === 'margin' && f.k === 'ship') return src.ship != null ? `${src.ship} from Sourcing` : '0';
  if (k === 'margin' && f.k === 'price' && l.facts.price != null) return `They ask ${money(l.facts.price, l.facts.cur)}`;
  if (f.def != null) return String(f.def);
  if (k === 'launch' && f.k === 'kill') return 'When do you stop the ad?';
  if (k === 'launch' && f.k === 'scale') return 'When do you raise the budget?';
  return f.t === 'url' ? 'https://' : f.t === 'money' ? '0.00' : '';
}
// Searches for the step's work: the supplier, trademarks and the ad rules, the competitors' ads.
function lnHelp(l, k) {
  const f = l.facts;
  const q = encodeURIComponent(l.title || f.title || '');
  const links = {
    sourcing: [lnA(src1688(f.zh || f.title || ''), 'Search 1688'), lnA('https://www.aliexpress.com/wholesale?SearchText=' + q, 'Search AliExpress'),
      `<button class="lnuse" data-spopen="${esc(l.key)}" title="Score up to 5 suppliers side by side, check the gates, record the choice">🏭 Compare suppliers</button>`],
    compliance: [lnA('https://www.tmdn.org/tmview/#/tmview/results?page=1&pageSize=30&criteria=C&basicSearch=' + q, 'Trademarks (TMview)'), lnA('https://transparency.meta.com/policies/ad-standards/', "Meta's ad rules")],
    research: [lnA(f.ad, f.source === 'tiktok' ? 'Its Meta ads' : 'Its ad'), lnA('https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=ALL&media_type=all&search_type=keyword_unordered&q=' + q, 'Search the Ad Library'), lnA(f.product || f.store, f.source === 'tiktok' ? 'On TikTok' : 'Their shop')],
  }[k];
  return links ? `<div class="lnlinks">${links.join('')}</div>` : '';
}
function lnCalcHtml(l) {
  const K = window.LAUNCH;
  const m = K.marginOf(K.marginInputs(l.steps));
  if (!m) return '<p class="lnmuted">Fill in the selling price and the unit cost (here or in Sourcing): the numbers show as you type.</p>';
  const row = (k, label, v) => `<div><dt>${esc(label)}</dt><dd data-out="${k}">${esc(v)}</dd></div>`;
  return `<dl class="lnout">${row('be_roas', 'Break-even ROAS', m.be_roas == null ? 'none: every order loses money' : m.be_roas + '×')}
    ${row('profit', 'Profit per order', m.profit == null ? 'add a target CPA' : `${lnEur(m.profit)} at a ${lnEur(m.cpa)} CPA`)}
    ${row('contribution', 'Margin before ads', `${lnEur(m.contribution)} (${m.pct}%)`)}
    ${row('be_cpa', 'Max CPA to break even', lnEur(m.be_cpa))}
    ${row('taxes', 'VAT + payment fees', `${lnEur(m.vat)} + ${lnEur(m.fees)}`)}</dl>`;
}
function lnSugHtml(l) {
  const s = window.LAUNCH.summaryOf(l);
  if (!s.kill) return '<p class="lnmuted">With the margin filled in, a kill rule and a scale rule are suggested here.</p>';
  return `<p><span>${esc(s.kill)}</span><button class="lnuse" data-use="kill">Use</button></p><p><span>${esc(s.scale)}</span><button class="lnuse" data-use="scale">Use</button></p>`;
}
function lnRowHtml(l) {
  const s = window.LAUNCH.summaryOf(l);
  const state = l.decision === 'go' ? 'Go' : l.decision === 'no' ? 'No go' : l.pinned ? '📌 Launching' : `${s.done}/${s.of}`;
  const sub = [LN_SRC[l.facts.source], s.be_roas != null ? 'break-even ROAS ' + s.be_roas : '', `${s.done} of ${s.of} steps`].filter(Boolean).join(' · ');
  return `<button class="lnrow" data-focus="${esc(l.key)}"><span class="lnth">${lnImg(l.facts)}</span><span class="lnrt"><b>${esc(l.title || l.facts.title)}</b><small>${esc(sub)}</small></span><span class="lnrs${l.decision ? ' ' + l.decision : ''}">${esc(state)}</span></button>`;
}
function lnPickHtml() {
  if (!LN.picking) return '<button class="lnstart" data-ln="pick">+ Start a launch from an approved product</button>';
  if (!LN.pick) return '<p class="lnmuted">Loading the approved products…</p>';
  if (!LN.pick.length) return '<p class="lnmuted">No approved product without a launch card. Approve one (✓ in the Inbox, or Approved on the TikTok tab) and it shows here.</p>';
  return `<h3>Approved products: start a launch card</h3>${LN.pick.map((c) => {
    const f = c.facts;
    const sub = [LN_SRC[f.source], f.approved_at ? 'approved ' + day(f.approved_at) : '', f.age != null ? `ads ${f.age}d` : '', f.sold != null ? fmt(f.sold) + ' sold' : ''].filter(Boolean).join(' · ');
    return `<div class="lnrow"><span class="lnth">${lnImg(f)}</span><span class="lnrt"><b>${esc(f.title)}</b><small>${esc(sub)}</small></span><button class="lnbtn" data-start="${esc(c.key)}">Start</button></div>`;
  }).join('')}`;
}
async function lnPick() {
  try {
    const res = await fetch('/api/launch?pick=1', { credentials: 'same-origin', headers: { Accept: 'application/json' } });
    if (res.status === 401) { location.reload(); return; }
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || 'HTTP ' + res.status);
    LN.pick = j.candidates;
  } catch (e) {
    LN.picking = false;
    toast('Could not load the approved products: ' + e.message, '');
  }
  const box = st.view === 'launch' && document.querySelector('#lnbox .lnpick');
  if (box) box.innerHTML = lnPickHtml();
}

// Saves go out one after the other, so an older save never lands after a newer one.
function lnPost(body) {
  LN.saving++;
  lnSaved('Saving…');
  const run = async () => {
    const res = await fetch('/api/launch', { method: 'POST', credentials: 'same-origin', keepalive: true, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || 'HTTP ' + res.status);
    return j;
  };
  const p = LN.chain.then(run);
  LN.chain = p.then(() => {}, () => {});
  p.then(() => { if (--LN.saving === 0) lnSaved('Saved ✓'); }, (e) => { LN.saving--; lnSaved(''); toast('Could not save: ' + e.message, ''); });
  return p;
}
function lnSaveStep(key, k) {
  const l = (LN.list || []).find((x) => x.key === key);
  const step = l && l.steps[k];
  if (step) lnPost({ key, step: k, done: step.done, note: step.note, v: step.v }).catch(() => {});
}
// One timer per card and step: typing saves 0.7 s after the last key; a tick, a pick or leaving the field saves at once.
function lnQueue(key, k, wait) {
  const id = k + ':' + key;
  clearTimeout(LN.timers.get(id));
  LN.timers.set(id, setTimeout(() => { LN.timers.delete(id); lnSaveStep(key, k); }, wait));
}
function lnFlush() {
  for (const [id, t] of LN.timers) {
    clearTimeout(t);
    lnSaveStep(id.slice(id.indexOf(':') + 1), id.slice(0, id.indexOf(':')));
  }
  LN.timers.clear();
}
function lnEdit(el, changed) {
  const d = el.closest && el.closest('#lnbox [data-step]');
  const l = lnFocus();
  if (!d || !l || !el.matches('[data-f], [data-note], [data-done]')) return;
  const K = window.LAUNCH;
  const k = d.dataset.step;
  const raw = { done: d.querySelector('[data-done]').checked, note: d.querySelector('[data-note]').value, v: {} };
  for (const x of d.querySelectorAll('[data-f]')) raw.v[x.dataset.f] = x.type === 'checkbox' ? x.checked : x.value;
  const step = K.cleanStep(k, raw);
  // What you typed but cannot be saved (not a number, not a link) is marked when you leave the field.
  for (const x of d.querySelectorAll('input[data-f]:not([type="checkbox"]), textarea[data-f]')) {
    const ok = !x.value.trim() || step.v[x.dataset.f] !== undefined;
    if (ok) x.removeAttribute('aria-invalid');
    else if (changed) x.setAttribute('aria-invalid', 'true');
    if (changed && ok && x === el && x.type === 'url' && step.v[x.dataset.f]) x.value = step.v[x.dataset.f]; // https:// added
  }
  l.steps = Object.assign({}, l.steps, { [k]: step });
  d.classList.toggle('done', step.done);
  d.querySelector('.lnn').textContent = step.done ? '✓' : String(K.STEPS.findIndex((s) => s.k === k) + 1);
  d.querySelector('[data-fill]').textContent = lnFill(K.STEPS.find((s) => s.k === k), step);
  lnLive(l);
  lnQueue(l.key, k, changed ? 0 : 700);
}
// After every change: the decision card, the margin's numbers, the suggested rules and the margin's hints follow.
function lnLive(l) {
  if ($('lndec')) $('lndec').innerHTML = lnDecHtml(l);
  if ($('lncalc')) $('lncalc').innerHTML = lnCalcHtml(l);
  if ($('lnsug')) $('lnsug').innerHTML = lnSugHtml(l);
  for (const x of document.querySelectorAll('#lnbox [data-step="margin"] [data-f="cogs"], #lnbox [data-step="margin"] [data-f="ship"]')) x.placeholder = lnPh(l, 'margin', { k: x.dataset.f });
}
async function lnStart(b) {
  b.disabled = true;
  let j;
  try { j = await lnPost({ start: b.dataset.start }); } catch (e) { b.disabled = false; return; }
  const l = j.launch;
  LN.list = [l].concat((LN.list || []).filter((x) => x.key !== l.key));
  Object.assign(LN, { focus: l.key, picking: false, pick: null, open: new Set(['sourcing']) });
  lnCount();
  lnRender();
  window.scrollTo({ top: 0 });
  toast(l.pinned ? '📌 Launch card started and pinned' : 'Launch card started', '');
}
async function lnPin() {
  const l = lnFocus();
  if (!l) return;
  let j;
  try { j = await lnPost({ key: l.key, pin: !l.pinned }); } catch (e) { return; }
  for (const x of LN.list) x.pinned = false; // the server cleared the old pin in the same batch
  l.pinned = j.launch.pinned;
  lnRender();
  toast(l.pinned ? '📌 Pinned: the product you launch now' : 'Unpinned', '');
}
async function lnDecide(d) {
  const l = lnFocus();
  if (!l) return;
  const want = l.decision === d ? '' : d; // a second tap takes it back
  const was = l.pinned;
  let j;
  try { j = await lnPost({ key: l.key, decision: want }); } catch (e) { return; }
  Object.assign(l, { decision: j.launch.decision, pinned: j.launch.pinned });
  lnCount();
  lnRender();
  toast(want === 'go' ? 'Go: launch it' : want === 'no' ? (was ? 'No go: off the launch pin' : 'No go') : 'Decision taken back', '');
}
function lnUse(k) {
  const l = lnFocus();
  const s = l && window.LAUNCH.summaryOf(l);
  const el = document.querySelector(`#lnbox [data-step="launch"] [data-f="${k}"]`);
  if (!s || !s[k] || !el) return;
  el.value = s[k];
  lnEdit(el, true);
}
async function lnRemove(b) {
  if (!b.dataset.sure) { // a second tap, so a slip never wipes a checklist
    b.dataset.sure = '1';
    b.textContent = 'Tap again to remove';
    setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = 'Remove this launch card'; } }, 3000);
    return;
  }
  const l = lnFocus();
  if (!l) return;
  for (const [id, t] of LN.timers) if (id.slice(id.indexOf(':') + 1) === l.key) { clearTimeout(t); LN.timers.delete(id); }
  try { await lnPost({ key: l.key, remove: true }); } catch (e) { return; }
  LN.list = LN.list.filter((x) => x !== l);
  Object.assign(LN, { focus: LN.list.length ? LN.list[0].key : '', pick: null, picking: !LN.list.length });
  lnCount();
  lnRender();
  if (LN.picking) lnPick();
  toast('Launch card removed', '');
}
$('lnbox').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  if (b.dataset.tab) lnTab(b.dataset.tab);
  else if (b.dataset.spopen) spFromLaunch(b.dataset.spopen);
  else if (b.dataset.start) lnStart(b);
  else if (b.dataset.focus) { lnFlush(); Object.assign(LN, { focus: b.dataset.focus, open: new Set() }); lnRender(); window.scrollTo({ top: 0 }); }
  else if (b.dataset.use) lnUse(b.dataset.use);
  else if (b.dataset.ld) lnDecide(b.dataset.ld);
  else if (b.dataset.ln === 'pick') { LN.picking = true; lnRender(); lnPick(); }
  else if (b.dataset.ln === 'pin') lnPin();
  else if (b.dataset.ln === 'remove') lnRemove(b);
});
$('lnbox').addEventListener('input', (e) => lnEdit(e.target, false));
$('lnbox').addEventListener('change', (e) => lnEdit(e.target, true));
$('lnbox').addEventListener('toggle', (e) => { const d = e.target; if (d.dataset && d.dataset.step) { if (d.open) LN.open.add(d.dataset.step); else LN.open.delete(d.dataset.step); } }, true);
$('lnbox').addEventListener('error', (e) => { if (e.target.tagName === 'IMG') { const i = document.createElement('i'); i.textContent = '?'; e.target.replaceWith(i); } }, true);
$('lnseg').addEventListener('click', () => goView('launch'));
// Another view or tab: the launch view steps aside. These run after the views' own handlers, so st.view is the new one.
for (const b of document.querySelectorAll('[data-view], [data-scope]')) b.addEventListener('click', () => { if (st.view !== 'launch') lnLeave(); });
addEventListener('pagehide', lnFlush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') lnFlush(); });
addEventListener('load', () => { if (!LN.list) lnLoad().catch(() => {}); }); // the count on 🚀: cards that are not a no-go

// ---- 🏭 Suppliers (supplier.mjs), the Launch view's second tab: which supplier to choose for a product, with the
// evidence. Up to 5 suppliers side by side, scored on 7 criteria (quality and delivery count most; the weights are
// yours), the hard gates (one fail and it is out), the checklist, the questions for suppliers in English and Chinese,
// and the decision record with a re-check every 90 days. The board scores as you type with the code the server runs
// (/supplier.js: window.SUPPLIER). Each part saves on its own, one save after the other.
// html: what the verdict, the table and the suppliers' boxes show now. A box is only written again when it changes:
// leaving a field fires 'change' after its last 'input', and a box written again then would swallow the tap that left it.
const SP = { list: null, focus: '', prod: null, open: new Set(), timers: new Map(), chain: Promise.resolve(), saving: 0, choosing: 0, html: {} };
const spReady = new Promise((ok, no) => {
  if (window.SUPPLIER) { ok(); return; }
  $('spkit').addEventListener('load', () => (window.SUPPLIER ? ok() : no(new Error('the supplier code did not run'))), { once: true });
  $('spkit').addEventListener('error', () => no(new Error('the supplier code did not load')), { once: true });
});
spReady.catch(() => {}); // said when the tab opens
const SP_MARKET = { eu: 'NL/DE', us: 'the US', both: 'NL/DE and the US' };
const spK = () => window.SUPPLIER;
// A decision and its re-check are dated in full: '30 Jan 2027'.
const spDate = (iso) => { const d = new Date(iso); return Number.isFinite(+d) ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : ''; };
const spSaved = (t) => { const el = $('spsaved'); if (el) el.textContent = t; };
const spOn = () => st.view === 'launch' && LN.tab === 'supplier';
const spCount = () => { for (const el of document.querySelectorAll('[data-nsup]')) el.textContent = SP.list && SP.list.length ? SP.list.length : ''; };
const spSumText = (r) => (!r ? '' : `${r.score}/100 · ${r.status === 'fail' ? '✗ ' + r.failed.join(', ') : r.status === 'open' ? `${r.open.length} gate${r.open.length === 1 ? '' : 's'} open` : '✓ gates'}`);
const spGateText = (x) => (!x ? '' : (x.state === 'pass' ? '✓ ' : x.state === 'fail' ? '✗ ' : '… ') + x.why);
const spAutoLabel = (c, x) => (x && x.auto != null ? `Auto: ${x.auto}` : c.auto ? 'Auto: not known yet (counts 0)' : 'Not scored (counts 0)');

async function spLoadList() {
  await SP.chain; // saves on their way land first
  const res = await fetch('/api/supplier', { credentials: 'same-origin', headers: { Accept: 'application/json' } });
  if (res.status === 401) { location.reload(); return; }
  const j = await res.json();
  if (!res.ok) throw new Error(j.error || 'HTTP ' + res.status);
  SP.list = j.products;
}
async function spLoadOne(key) {
  await SP.chain;
  const res = await fetch('/api/supplier?key=' + encodeURIComponent(key), { credentials: 'same-origin', headers: { Accept: 'application/json' } });
  if (res.status === 401) { location.reload(); return; }
  const j = await res.json();
  if (res.status === 404) { Object.assign(SP, { focus: '', prod: null }); return; } // removed in another tab
  if (!res.ok) throw new Error(j.error || 'HTTP ' + res.status);
  SP.prod = j.product;
}
// The tab: the list of scorecards, or the one you work on.
async function spView() {
  $('spbox').hidden = false;
  const shown = SP.list && window.SUPPLIER ? JSON.stringify([SP.list, SP.prod]) : '';
  if (shown) spRender();
  else $('spbox').innerHTML = `${lnBarHtml()}<div class="sload"><i class="spin"></i>Loading…</div>`;
  try {
    await spReady;
    await Promise.all([spLoadList(), SP.focus ? spLoadOne(SP.focus) : null, LN.list ? null : lnLoad().catch(() => {})]);
    if (!spOn()) return;
    if (JSON.stringify([SP.list, SP.prod]) !== shown) spRender(); // unchanged: no new render, a field you tapped keeps its keyboard
    spCount();
  } catch (e) {
    if (spOn()) $('spbox').innerHTML = `${lnBarHtml()}<p class="lnmuted">Could not load the suppliers: ${esc(e.message)}</p>`;
  }
}
function spRender() {
  const p = SP.focus && SP.prod && SP.prod.key === SP.focus ? SP.prod : null;
  $('spbox').innerHTML = `${lnBarHtml()}<div class="lnhead"><h2>Suppliers</h2><small class="lnsaved" id="spsaved" aria-live="polite"></small>
      <p>${p ? 'Up to 5 suppliers side by side. Quality and delivery count most; one failed gate and a supplier is out. Everything saves as you type.' : 'Which supplier to choose, with the evidence: score up to 5 side by side, check the gates, record the choice and re-check it.'}</p></div>
    ${p ? spProdHtml(p) : spListHtml()}`;
}

function spListHtml() {
  const list = SP.list || [];
  const have = new Set(list.map((x) => x.key));
  const cards = (LN.list || []).filter((l) => !have.has(l.key) && l.decision !== 'no');
  const rows = list.map((x) => {
    const sub = [x.suppliers ? `${x.suppliers} supplier${x.suppliers === 1 ? '' : 's'}` : 'No suppliers yet', x.chosen ? `chosen: ${x.chosen.name}` : x.best ? `best: ${x.best.name} ${x.best.score}` : '', `checklist ${x.checks.done}/${x.checks.of}`].filter(Boolean).join(' · ');
    const state = x.chosen ? (x.chosen.overdue ? 'Re-check due' : 'Chosen') : x.best && x.best.status !== 'fail' ? x.best.score + '/100' : '';
    return `<button class="lnrow" data-spfocus="${esc(x.key)}"><span class="lnth">${lnImg({ img: x.img, title: x.title })}</span><span class="lnrt"><b>${esc(x.title)}</b><small>${esc(sub)}</small></span><span class="lnrs${x.chosen ? ' go' : ''}">${esc(state)}</span></button>`;
  }).join('');
  return `<section class="lnother" aria-label="Scorecards">${list.length ? `<h3>Products</h3>${rows}` : '<p class="lnmuted">No scorecards yet.</p>'}</section>
    <section class="lnpick" aria-label="Start a scorecard"><h3>Start a scorecard</h3>
      ${cards.map((l) => `<div class="lnrow"><span class="lnth">${lnImg(l.facts)}</span><span class="lnrt"><b>${esc(l.title || l.facts.title)}</b><small>${esc((LN_SRC[l.facts.source] || '') + ' · its launch card')}</small></span><button class="lnbtn" data-spstart="${esc(l.key)}">Start</button></div>`).join('')}
      <div class="spadd"><label class="lnf"><span>A product by name (one without a launch card too)</span><input id="spname" type="text" maxlength="120" placeholder="Product name" autocomplete="off"></label>
        <label class="lnf"><span>Its link (optional)</span><input id="splink" type="url" inputmode="url" spellcheck="false" maxlength="500" placeholder="https://" autocomplete="off"></label>
        <button class="lnstart" data-sp="add">+ Start a scorecard</button></div></section>`;
}

// One product: its card with the verdict, the ranking, the side-by-side table, the suppliers, the setup and the record.
function spProdHtml(p) {
  const K = spK();
  const s = K.summaryOf(p, Date.now());
  const f = p.facts || {};
  const set = s.setup;
  const q = encodeURIComponent(p.title || f.title || '');
  const price = f.price != null ? money(f.price, f.cur) + (f.source === 'own' ? ' at the competitor' : ' in their shop') : '';
  const links = [lnA(f.link, f.source === 'own' ? 'Their product' : 'Shop'), lnA(src1688(set.zh || p.title || ''), 'Search 1688'), lnA('https://www.alibaba.com/trade/search?SearchText=' + q, 'Alibaba'), lnA('https://www.aliexpress.com/wholesale?SearchText=' + q, 'AliExpress')];
  return `<button class="lnuse spback" data-sp="back">← All products</button>
    <article class="lncard">
      <div class="lnprod"><span class="lnth big">${lnImg(f)}</span>
        <div class="lnpt"><h3>${esc(p.title)}</h3><small>${esc([price, f.note].filter(Boolean).join(' · '))}</small><div class="lnlinks">${links.join('')}</div></div></div>
      <div id="spverdict">${(SP.html.verdict = spVerdictHtml(p, s))}</div>
      <div id="spchoose">${SP.choosing ? spChooseHtml(s) : ''}</div>
    </article>
    <section class="spcmp" aria-label="Side by side"><h3 class="sph">Side by side</h3><div id="sptable">${(SP.html.table = spTableHtml(s))}</div></section>
    ${spSupsHtml(p, s)}
    ${spSetupHtml(p, s)}
    <button class="lnremove" data-sp="remove">Remove this scorecard</button>`;
}
function spVerdictHtml(p, s) {
  const K = spK();
  const set = s.setup;
  const c = p.choice && p.choice.current;
  const top = s.rows.find((r) => r.slot === (s.chosen ? s.chosen.slot : s.pick));
  let sub = '';
  if (s.chosen) sub = `Chosen ${spDate(s.chosen.at)}${top ? ` · ${top.score}/100 now` : ''} · re-check by ${spDate(s.chosen.next)}${s.chosen.overdue ? ' (overdue)' : ''}: every ${K.RECHECK_DAYS} days and before every reorder`;
  else if (top) sub = [`${top.score}/100`, top.days != null ? `${top.days} days to ${SP_MARKET[set.market]}` : '', top.landed != null ? `${money(top.landed, set.cur)} an order landed` : '', top.status === 'pass' ? 'every gate passed' : top.open.length ? `to confirm: ${top.open.join(', ')}` : ''].filter(Boolean).join(' · ');
  const backup = s.chosen ? c.backup : s.rows.find((r) => r.slot === s.backup);
  const flags = s.flags.length ? s.flags.map((x) => `<li class="${esc(x.level)}">${esc(x.text)}</li>`).join('') : '<li class="green">No flags</li>';
  return `<div class="spv" data-level="${esc(s.level)}"><p class="spvt">${esc(s.verdict)}</p>${sub ? `<p class="spvs">${esc(sub)}</p>` : ''}
      ${backup ? `<p class="spvs">Backup: ${esc(backup.name)} (${esc(backup.score)}/100)</p>` : ''}
      <ul class="lnflags" aria-label="Flags">${flags}</ul>
      ${s.rows.length ? `<ol class="sprank" aria-label="Ranking">${s.rows.map((r) => spRankHtml(r, s)).join('')}</ol>` : ''}</div>`;
}
function spRankHtml(r, s) {
  const chosen = s.chosen && s.chosen.slot === r.slot;
  const gate = r.status === 'fail' ? `✗ out: ${r.failed.join(', ')}` : r.status === 'open' ? `${r.open.length} gate${r.open.length === 1 ? '' : 's'} open` : '✓ every gate';
  const sub = [gate, r.days != null ? r.days + ' days' : '', r.landed != null ? money(r.landed, s.setup.cur) : '', `${r.scored}/${r.of} scored`].filter(Boolean).join(' · ');
  const act = chosen ? '<span class="spchosen">✓ Chosen</span>' : r.status === 'fail' ? '' : `<button class="lnuse" data-spchoose="${r.slot}">Choose</button>`;
  return `<li class="${esc(r.status)}"><span class="n">${esc(r.rank)}</span><span><b>${esc(r.name)}</b><span class="sps">${esc(r.score)}</span><small class="spst ${esc(r.status)}">${esc(sub)}</small></span>${act}</li>`;
}
function spChooseHtml(s) {
  const r = s.rows.find((x) => x.slot === SP.choosing);
  if (!r || r.status === 'fail') return '';
  const others = s.rows.filter((x) => x.slot !== r.slot && x.status !== 'fail');
  return `<div class="spchoose"><p>Choose <b>${esc(r.name)}</b> (${esc(r.score)}/100)?${r.open.length ? ` Still to confirm before you pay for stock: ${esc(r.open.join(', '))}.` : ''}</p>
      <label class="lnf wide"><span>Why this one (kept in the decision record)</span><textarea id="spwhy" rows="3" maxlength="1000" placeholder="Best sample, 9 days to NL, answers within a day"></textarea></label>
      <label class="lnf wide"><span>Backup</span><span class="selw"><select class="chip" id="spbackup">${others.map((x, i) => `<option value="${esc(x.slot)}"${i ? '' : ' selected'}>${esc(x.name)} (${esc(x.score)}/100)</option>`).join('')}<option value="0"${others.length ? '' : ' selected'}>No backup</option></select></span></label>
      <div class="spbtns"><button class="lnbtn" data-sp="decide">Save the decision</button><button class="lnuse" data-sp="cancel">Cancel</button></div></div>`;
}
// Side by side: a column per supplier, best first; the table scrolls sideways inside its box, never the page.
function spTableHtml(s) {
  if (!s.rows.length) return '<p class="lnmuted">Add the suppliers you compare below: up to 5.</p>';
