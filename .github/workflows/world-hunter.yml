# The hunt outside the EU: four times a day the next keywords in every market of lib/world.mjs (Switzerland, Norway, Australia,
# New Zealand, the UAE, the US, Canada and ten more), through the public Ad Library (Meta's API has no shop ads for these markets). No login. Writes only the
# world_* tables and the store signals; the board shows the result under 🌍 Outside EU.
# Run it by hand: Actions → World Hunter → Run workflow.
# Secrets: CF_API_TOKEN, CF_ACCOUNT_ID. META_TOKEN is optional: it answers "does this shop run ads in the EU at all?".
# CF_D1_TOKEN (optional, better): a Cloudflare token with only Account → D1 → Edit. When it is there the hunt uses it
# instead of CF_API_TOKEN, so this job holds no token that can change the board's Worker.
# GitHub turns the schedule off after 60 days without activity in this public repository: the board's 🌍 tab then
# says "No scan outside the EU in 24 hours". Turn it on again: Actions → World Hunter → Enable workflow.
name: World Hunter

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes the hunt may take (max 135; it stops in time and keeps what it found)'
        required: false
        default: '120'
      pages:
        description: 'At most this many shop pages to count per run'
        required: false
        default: '80'
  schedule:
    # Facebook limits one address after a few hundred searches and every run gets a new one, so more runs mean more searches.
    # Change these together with HUNT_HOURS in worker/src/board.html.
    - cron: '17 1 * * *'
    - cron: '17 7 * * *'
    - cron: '17 13 * * *'
    - cron: '17 19 * * *'

permissions:
  contents: read

concurrency:
  group: world-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    # world.mjs stops searching after at most 135 minutes (MAX_MINUTES), which leaves time for the board's table, Jev and
    # the store signals. A hunt cut off by this timeout would never write the board.
    timeout-minutes: 180
    env:
      CF_API_TOKEN: ${{ secrets.CF_D1_TOKEN || secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || '8934aca9-51d3-4f87-9c62-e897843149a1' }}
      META_TOKEN: ${{ secrets.META_TOKEN }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      WORLD_MINUTES: ${{ inputs.minutes || '120' }}
      WORLD_PAGES: ${{ inputs.pages || '80' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Database tables
        run: node winner-hunter/migrate.mjs

      # The Ad Library page only answers a real browser: the runner's Google Chrome.
      - name: Install Playwright
        working-directory: winner-hunter
        run: npm install --no-save --no-package-lock playwright-core@1.56.1

      - name: Hunt outside the EU
        run: node winner-hunter/world.mjs

      # Jev's answers about each new product, for the board. Also after a red hunt. No key or no balance only skips this.
      - name: Jev check
        if: ${{ !cancelled() }}
        run: node winner-hunter/world-check.mjs

      # Each new product's rank in its store's best-seller list and the store's Trustpilot. Also after a red hunt.
      - name: Store signals
        if: ${{ !cancelled() }}
        run: node winner-hunter/bestsellers.mjs
