# The AI read (winner-hunter/ai-check.mjs, lib/ai-check.mjs): a cheap Claude model (Claude Haiku 5.5) reads each board
# product once (what it is, niche, hook, buyer, wow, saturation, claims risk, and a 0-100 fit with reasons) for the
# board's collapsed, experimental "AI read". Then ai-eval.mjs compares its fit with your approve / reject decisions.
# Nothing on the board is hidden or ranked by it. Off without the ANTHROPIC_API_KEY secret.
# Spend is capped: at most max_usd a run (worst case of every request; the answers usually cost a fraction of it) and
# AI_MONTH_USD a month (repository variable, default 5). Requests go through the Message Batches API (half price): a
# batch usually ends within minutes, and one still running is collected by the next run.
# Secrets: CF_API_TOKEN (or CF_D1_TOKEN), CF_ACCOUNT_ID, ANTHROPIC_API_KEY. Variables (optional): AI_MODEL, AI_MAX_USD, AI_MONTH_USD.
# This repository is public: the log and the summary hold counts and money only, no product names and no decisions.
name: AI check

on:
  workflow_dispatch:
    inputs:
      max_usd:
        description: 'Most this run may spend, in US dollars (the worst case; the real cost is usually much lower)'
        required: false
        default: '0.50'
      limit:
        description: 'At most this many products to send'
        required: false
        default: '500'
      wait_minutes:
        description: 'Minutes to wait for the batch before leaving it to the next run (max 30)'
        required: false
        default: '20'
  schedule:
    # After the hunts outside the EU of 01:17 and 13:17 UTC (world-hunter.yml) have saved their products.
    - cron: '41 4 * * *'
    - cron: '41 16 * * *'

permissions:
  contents: read

concurrency:
  group: ai-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CF_API_TOKEN: ${{ secrets.CF_D1_TOKEN || secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || '8934aca9-51d3-4f87-9c62-e897843149a1' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_MODEL: ${{ vars.AI_MODEL || 'claude-haiku-5-5' }}
      AI_MAX_USD: ${{ inputs.max_usd || vars.AI_MAX_USD || '0.50' }}
      AI_MONTH_USD: ${{ vars.AI_MONTH_USD || '5' }}
      AI_LIMIT: ${{ inputs.limit || '500' }}
      AI_WAIT_MINUTES: ${{ inputs.wait_minutes || '20' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Database tables
        run: node winner-hunter/migrate.mjs

      # Anthropic's SDK, pinned (the same version as tests.yml).
      - name: Anthropic SDK
        working-directory: winner-hunter
        run: npm install --no-save --no-package-lock --no-audit --no-fund @anthropic-ai/sdk@1.3.0

      - name: AI check
        run: node winner-hunter/ai-check.mjs

      # Agreement with your decisions, counts only (also after a failed check: earlier answers count too).
      - name: AI eval
        if: ${{ !cancelled() }}
        run: node winner-hunter/ai-eval.mjs
