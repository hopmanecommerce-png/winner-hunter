# Lasso stores (lasso.mjs): finds Shopify stores whose checkout runs on Lasso and saves their best sellers in D1 table
# lasso_stores (docs/research/lasso-stores.md). Free sources only: AlienVault OTX passive DNS, urlscan.io search and
# DuckDuckGo's Tracker Radar, then every store is checked on the store itself.
# Off: it runs only when you start it (Actions → Lasso stores → Run workflow). Weekly is enough; to make it weekly, add
#   schedule:
#     - cron: '17 3 * * 1'
# under "on:". The log and the summary only count stores (this repository is public); the stores are in D1.
# Secrets: CF_API_TOKEN, CF_ACCOUNT_ID (CF_D1_TOKEN, a D1-only Cloudflare token, is used instead of CF_API_TOKEN when it is
# there); URLSCAN_API_KEY is optional (a free urlscan.io account only raises the search limits).
name: Lasso stores

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Time budget in minutes (1–60)'
        required: false
        default: '20'
      days:
        description: 'urlscan.io: pages scanned in the last … days'
        required: false
        default: '30'

permissions:
  contents: read

concurrency:
  group: lasso-stores
  cancel-in-progress: false

jobs:
  lasso:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CF_API_TOKEN: ${{ secrets.CF_D1_TOKEN || secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || '8934aca9-51d3-4f87-9c62-e897843149a1' }}
      URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
      LASSO_MINUTES: ${{ inputs.minutes }}
      LASSO_DAYS: ${{ inputs.days }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Database tables
        run: node winner-hunter/migrate.mjs
      - name: Lasso stores
        run: node winner-hunter/lasso.mjs
