# Lasso stores (winner-hunter/lasso.mjs; what works and why: docs/research/lasso-discovery.md): the weekly discovery of
# Shopify stores that use Lasso's hosted checkout. Sources: passive DNS (OTX and Mnemonic, free, no key), urlscan.io
# (free), the shops already on the board (free), lasso-extra.txt, and Scrape Creators' Meta Ad Library search (paid,
# capped). Every candidate is checked live; a new store is saved in D1 lasso_stores with its source and found_at, and the
# board's "Lasso checkout" filter takes it in (its chip shows "+N new" for the stores found in the last 7 days).
# OFF by default: run it by hand (Actions → Lasso stores → Run workflow), or set the repository variable LASSO_STORES = on
# for a weekly run (Mondays). With ads = on (or the variable LASSO_ADS = on) it also puts each store's active ads outside
# the EU into world_ads, which the next World Hunter run turns into products in the 🌍 Inbox under its usual rules.
# Credits: LASSO_CREDITS (the "credits" box, or the repository variable for the weekly run) is a hard cap of Scrape Creators
# credits per run, 50 by default (≈ $0.09 at the $47 pack); 0 = the free sources only.
# The list is this run's artifact "lasso-stores" (14 days). This repository is public: any signed-in GitHub user can
# download an artifact, so the summary only has counts.
# Secrets (all existing): CF_API_TOKEN (CF_D1_TOKEN, a D1-only token, is used instead when it is there) and CF_ACCOUNT_ID,
# to read and save; without them the run only makes the artifact. SCRAPECREATORS_API_KEY for the ad searches (without it
# they are skipped). Optional: URLSCAN_API_KEY (a free urlscan.io account: more searches a day).
name: Lasso stores

on:
  workflow_dispatch:
    inputs:
      credits:
        description: 'Most Scrape Creators credits for ad searches this run (hard cap; 0 = free sources only; 50 ≈ $0.09)'
        required: false
        default: '50'
      sources:
        description: 'Sources: all, or some of: dns urlscan board ads extra'
        required: false
        default: 'all'
      dry_run:
        description: 'Dry run: find and check, save nothing in D1 (the stores are in the artifact)'
        type: boolean
        required: false
        default: false
      days:
        description: 'Days back on urlscan.io (at most 30 without an urlscan key)'
        required: false
        default: '30'
      ads:
        description: 'Also put their ads outside the EU into the hunt: on / off'
        required: false
        default: 'off'
      extra:
        description: 'More domains to check (a.com b.com)'
        required: false
        default: ''
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: lasso-stores
  cancel-in-progress: false

jobs:
  lasso:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.LASSO_STORES == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CF_API_TOKEN: ${{ secrets.CF_D1_TOKEN || secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || '8934aca9-51d3-4f87-9c62-e897843149a1' }}
      URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
      SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
      LASSO_CREDITS: ${{ inputs.credits || vars.LASSO_CREDITS || '50' }}
      LASSO_SOURCES: ${{ inputs.sources || vars.LASSO_SOURCES || 'all' }}
      LASSO_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      LASSO_DAYS: ${{ inputs.days || '30' }}
      LASSO_ADS: ${{ inputs.ads || vars.LASSO_ADS || 'off' }}
      LASSO_EXTRA: ${{ inputs.extra }}
      LASSO_OUT: lasso-out
    steps:
      - name: Check settings
        run: |
          case "$LASSO_CREDITS" in ''|*[!0-9]*) echo "::error::credits must be a number (0 = free sources only)"; exit 1;; esac
          if [ "$LASSO_CREDITS" -gt 1000 ]; then echo "::error::credits: at most 1000 a run"; exit 1; fi
          if [ "$LASSO_CREDITS" -gt 0 ] && [ -z "$SCRAPECREATORS_API_KEY" ]; then echo "::warning::No SCRAPECREATORS_API_KEY secret: the ad searches are skipped, the free sources run"; fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # A dry run changes nothing in D1, not even the tables.
      - name: Database tables
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' && !inputs.dry_run }}
        run: node winner-hunter/migrate.mjs

      # The Ad Library page only answers a real browser: the runner's Google Chrome (only for ads = on).
      - name: Install Playwright
        if: ${{ env.LASSO_ADS == 'on' && !inputs.dry_run }}
        working-directory: winner-hunter
        run: npm install --no-save --no-package-lock playwright-core@1.56.1

      - name: Lasso stores
        run: node winner-hunter/lasso.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: lasso-stores
          path: lasso-out/
          retention-days: 14
          if-no-files-found: ignore
