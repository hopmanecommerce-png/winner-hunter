# Puts the Winner Hunter board (winner-hunter/worker) online as a Cloudflare Worker and sets its PIN.
# Runs by itself when the board code changes on the main branch, or by hand: Actions → Deploy board → Run workflow.
# Secrets: CF_API_TOKEN (Account → D1 → Edit and Account → Workers Scripts → Edit), CF_ACCOUNT_ID, BOARD_PIN,
# META_TOKEN (for the in-board ad viewer, which opens ads in Cloudflare Browser Run).
name: Deploy board

on:
  push:
    branches: [main]
    paths:
      - 'winner-hunter/worker/**'
      - '.github/workflows/deploy-board.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-board
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || '8934aca9-51d3-4f87-9c62-e897843149a1' }}
      BOARD_PIN: ${{ secrets.BOARD_PIN }}
      META_TOKEN: ${{ secrets.META_TOKEN }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          [ -n "$CF_API_TOKEN" ] || missing="$missing CF_API_TOKEN"
          [ -n "$CF_ACCOUNT_ID" ] || missing="$missing CF_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s):$missing (Settings → Secrets and variables → Actions; see winner-hunter/README.md)"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Database tables
        run: node winner-hunter/migrate.mjs

      - name: Worker packages
        working-directory: winner-hunter/worker
        run: npm ci --no-audit --no-fund

      - name: Deploy
        id: deploy
        working-directory: winner-hunter/worker
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Board PIN
        working-directory: winner-hunter/worker
        run: |
          if [ -z "$BOARD_PIN" ]; then
            echo "::warning::No BOARD_PIN secret: the board stays closed until you add it and run this workflow again"
            exit 0
          fi
          printf '%s' "$BOARD_PIN" | npx --yes wrangler@4 secret put BOARD_PIN

      - name: Ad viewer token
        working-directory: winner-hunter/worker
        run: |
          if [ -z "$META_TOKEN" ]; then
            echo "::warning::No META_TOKEN secret: the /api/ad viewer stays off (the board does not use it: ▶ opens the Ad Library)"
            exit 0
          fi
          printf '%s' "$META_TOKEN" | tr -d '[:space:]' | npx --yes wrangler@4 secret put META_TOKEN

      - name: Board link
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Board: ${URL:-see the Deploy step log (Cloudflare → Workers & Pages → winner-hunter)}"
          echo "## Board: ${URL:-see the Deploy step log}" >> "$GITHUB_STEP_SUMMARY"
