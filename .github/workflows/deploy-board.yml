# Puts the Winner Hunter board (winner-hunter/worker) online as a Cloudflare Worker and sets its PIN.
# Runs by itself when the board code changes on the main branch, or by hand: Actions → Deploy board → Run workflow.
# The tests run first (tests.yml): a red test stops the deploy before the database or the board changes.
# Secrets: CF_API_TOKEN (Account → D1 → Edit and Account → Workers Scripts → Edit), CF_ACCOUNT_ID, BOARD_PIN.
# The Worker no longer gets META_TOKEN: the ad viewer (/api/ad) is off. A token an older deploy put there is never used;
# remove it with: cd winner-hunter/worker && npx wrangler secret delete META_TOKEN
name: Deploy board

on:
  push:
    branches: [main]
    paths:
      - 'winner-hunter/worker/**'
      - '.github/workflows/deploy-board.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-board
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || '8934aca9-51d3-4f87-9c62-e897843149a1' }}
      BOARD_PIN: ${{ secrets.BOARD_PIN }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          [ -n "$CF_API_TOKEN" ] || missing="$missing CF_API_TOKEN"
          [ -n "$CF_ACCOUNT_ID" ] || missing="$missing CF_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s):$missing (Settings → Secrets and variables → Actions; see winner-hunter/README.md)"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Saves D1 Time Travel's bookmark in this log first (the "D1 restore point" note), then makes the tables.
      - name: Database tables
        run: node winner-hunter/migrate.mjs

      - name: Worker packages
        working-directory: winner-hunter/worker
        run: npm ci --no-audit --no-fund

      # Red when wrangler fails or prints no board address: a failed deploy used to end green.
      - name: Deploy
        working-directory: winner-hunter/worker
        env:
          # A public repository's logs and summaries are public: its workers.dev subdomain (the board's address) stays out.
          HIDE: ${{ github.event.repository.private != true }}
        run: |
          set -o pipefail
          hide() { if [ "$HIDE" = true ]; then sed -E 's#[A-Za-z0-9-]+\.workers\.dev#***.workers.dev#g'; else cat; fi; }
          npx --yes wrangler@4 deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log" | hide
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)
          if [ -z "$URL" ]; then
            echo "::error::The deploy printed no board address (https://…workers.dev): the board may not be live, see the log above"
            exit 1
          fi
          echo "## Board: $URL" | hide | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$HIDE" = true ]; then
            echo "The address stays out of this public log: Cloudflare → Workers & Pages → winner-hunter-clean." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Board PIN
        working-directory: winner-hunter/worker
        run: |
          if [ -z "$BOARD_PIN" ]; then
            echo "::warning::No BOARD_PIN secret: the board stays closed until you add it and run this workflow again"
            exit 0
          fi
          printf '%s' "$BOARD_PIN" | npx --yes wrangler@4 secret put BOARD_PIN
