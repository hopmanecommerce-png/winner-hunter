# A test link for the board before it goes live. On every push to a branch other than main, this uploads the board
# as a new version of the Worker WITHOUT deploying it: the live board does not change. The version gets its own link,
# https://<branch>-winner-hunter-clean.<subdomain>.workers.dev (in the run summary; while the repository is public only
# as the board's own address with "<branch>-" in front, since anyone can read these logs).
# The test link uses the live database and PIN: Reject / Keep / Made ad there are saved for real.
# It changes nothing else in that database: no tables, no hunt, no store signals. Those run from main only
# (deploy-board.yml, world-hunter.yml), so a branch push, or a preview cancelled by the next push, can never leave the
# live scan stuck at "running" or take the live board's products off. A version that needs a new table or column
# cannot use it until it is merged (deploy-board.yml makes it first).
# Merging into main deploys the board as before (deploy-board.yml).
name: Preview board

on:
  push:
    branches-ignore: [main]
    paths:
      - 'winner-hunter/worker/**'
      - '.github/workflows/preview-board.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-board-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Worker packages
        working-directory: winner-hunter/worker
        run: npm ci --no-audit --no-fund

      - name: Upload a test version (the live board does not change)
        working-directory: winner-hunter/worker
        env:
          # A public repository's logs and summaries are public: its workers.dev subdomain (the board's address) stays out.
          HIDE: ${{ github.event.repository.private != true }}
        run: |
          set -o pipefail
          hide() { if [ "$HIDE" = true ]; then sed -E 's#[A-Za-z0-9-]+\.workers\.dev#***.workers.dev#g'; else cat; fi; }
          # The branch name as the link name: lowercase letters, digits and dashes, short enough for a web address.
          ALIAS=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-40 | sed -E 's/-+$//')
          case "$ALIAS" in [a-z]*) ;; *) ALIAS="b-$ALIAS" ;; esac
          npx --yes wrangler@4 versions upload --preview-alias "$ALIAS" --message "Preview of $GITHUB_REF_NAME" 2>&1 | tee "$RUNNER_TEMP/up.log" | hide
          URL=$(grep -oE "https://$ALIAS-[A-Za-z0-9.-]+\.workers\.dev" "$RUNNER_TEMP/up.log" | head -1 || true)
          if [ -z "$URL" ]; then
            echo "Test link: see the upload log above" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$HIDE" = true ]; then
            echo "## Test link: the board's address with \"$ALIAS-\" in front (https://$ALIAS-winner-hunter-clean.<subdomain>.workers.dev)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "## Test link: $URL" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "Same PIN and database as the live board: decisions made there are saved for real." >> "$GITHUB_STEP_SUMMARY"
